// Keep recent host-side fighter positions so client-fired attacks can be checked
// against the positions the shooter was actually seeing over the network.
function recordCombatHistory() {
  const now = performance.now();
  for(const e of E) {
    if(!e.combatHistory) e.combatHistory = [];
    if(e.dead) {
      e.combatHistory.length = 0;
      continue;
    }
    e.combatHistory.push({ time: now, x: e.x, z: e.z });
    while(e.combatHistory.length && now - e.combatHistory[0].time > 600) e.combatHistory.shift();
  }
}

function getCombatPosition(target, attacker = null, projectileTravelMs = 0) {
  const history = target.combatHistory;
  const rewindMs = isMultiplayer && isLobbyLeader && attacker && attacker !== pl
    ? attacker.hitRewindMs : 0;
  if(!(rewindMs > 0) || !history || history.length === 0) return target;

  // As a client-fired projectile travels, advance the historical target point by
  // the same amount so slow shots don't keep aiming at where the target used to be.
  const sampleTime = performance.now() - Math.max(0, rewindMs - Math.max(0, projectileTravelMs));
  if(sampleTime <= history[0].time) return history[0];
  for(let i = 1; i < history.length; i++) {
    const next = history[i];
    if(next.time >= sampleTime) {
      const prev = history[i - 1];
      const blend = (sampleTime - prev.time) / Math.max(1, next.time - prev.time);
      return {
        x: prev.x + (next.x - prev.x) * blend,
        z: prev.z + (next.z - prev.z) * blend
      };
    }
  }
  return target;
}

function blocked(x, z, r) {
  for(const h of Husks) if(Math.hypot(x - h.x, z - h.z) < 14 + r) return true;
  if(x < B+r || z < B+r || x > W-B-r || z > H-B-r) return true;
  for(const [rx, ry, rw, rh] of currentRects) {
    const cx = Math.max(rx, Math.min(x, rx+rw));
    const cz = Math.max(ry, Math.min(z, ry+rh));
    const dx = x - cx, dz = z - cz;
    if(dx*dx + dz*dz < r*r) return true;
  }
  return false;
}

function hasLOS(x1, z1, x2, z2) {
  const dx = x2 - x1, dz = z2 - z1, d = Math.hypot(dx, dz);
  if(d < 0.001) return !blocked(x1, z1, 3);
  const steps = Math.ceil(d / 8);
  for(let i = 0; i <= steps; i++) {
    if(blocked(x1 + (dx/steps)*i, z1 + (dz/steps)*i, 3)) return false;
  }
  return true;
}

function pushCollisions(e) {
  for(const h of Husks) {
    const dx = e.x - h.x, dz = e.z - h.z, d = Math.hypot(dx, dz), m = 14 + e.r;
    if(d < m) { e.x = h.x + (d > 0 ? dx / d : 1) * m; e.z = h.z + (d > 0 ? dz / d : 0) * m; }
  }
  e.x = Math.max(B+e.r, Math.min(W-B-e.r, e.x));
  e.z = Math.max(B+e.r, Math.min(H-B-e.r, e.z));

  for(const [rx, ry, rw, rh] of currentRects) {
    const cx = Math.max(rx, Math.min(e.x, rx+rw)), cz = Math.max(ry, Math.min(e.z, ry+rh));
    const dx = e.x - cx, dz = e.z - cz, d = Math.hypot(dx, dz);
    if(d < e.r) {
      if(d > 0) { e.x += (dx/d)*(e.r-d); e.z += (dz/d)*(e.r-d); }
      else e.z -= e.r;
    }
  }
}

// --- SPECTATING (first-person view through the spectated player's eyes) ---
function startSpectating() {
  isSpectating = true;
  spectateTarget = null;
  M.down = 0;
  spectatorBanner.innerText = isMultiplayer
    ? "SPECTATING · CLICK TO SWITCH PLAYER"
    : "SPECTATING · CLICK TO SWITCH · SPACE FOR MENU";
  spectatorBanner.style.display = "block";
  findNextSpectateTarget(1);
}

function findNextSpectateTarget(step = 1) {
  const aliveOthers = E.filter(e => !e.dead && e !== pl);
  if(aliveOthers.length === 0) {
    spectateTarget = null;
    return;
  }
  const idx = aliveOthers.indexOf(spectateTarget);
  spectateTarget = aliveOthers[(idx + step + aliveOthers.length) % aliveOthers.length];
}

function areEnemies(a, b) {
  if(!a || !b || a === b) return false;
  if(teamMode) return a.team !== b.team;
  return true;
}

function damageSourceColor(attacker, target) {
  if(target && target.sporePoison > 0) return "#c084fc";
  if(!attacker) return "#ffad5c";
  return (HEROES[attacker.ci] && HEROES[attacker.ci].roleCol) || "#ff5544";
}

function hurt(t, rawDmg, a, kb, attacker = null, damageType = "impact") {
  if(t.dead) return;
  if(isMultiplayer && !isLobbyLeader) return;
  if(t.chain && t.chain.inv) return; // Captain Oink is invulnerable while his chain is out / hooking
  if(teamMode && attacker && attacker !== t && attacker.team === t.team) return;

  if(t.ci === 6) { // Dentley: squire grace, Shield Guard
    if(t.grace > 0) rawDmg *= 0.4;
    if(t.guard > 0 && damageType !== "unblockable" && (!attacker || attacker !== t) &&
       Math.abs(Math.atan2(Math.sin(a + Math.PI - t.a), Math.cos(a + Math.PI - t.a))) <= 1.31) {
      const soaked = rawDmg * (damageType === "projectile" ? 0.75 : 0.60);
      rawDmg -= soaked;
      t.riposte = Math.min(40, t.riposte + soaked);
      if(soaked >= 1) spawnSparks(t.x, t.z, 0x9fc5ff, 3);
    }
    t.chan = 0; // any damage interrupts re-armouring
  }
  t.hp -= rawDmg;
  if(attacker && attacker !== t && rawDmg > 0) attacker.dmg += rawDmg;
  t.fl = 0.12;
  t.kx += Math.cos(a) * kb;
  t.kz += Math.sin(a) * kb;

  if(t.ai) {
    t.ai.alertTimer = 2.4;
    t.a = a + Math.PI;
    if(attacker && !attacker.dead) {
      t.ai.currentTarget = attacker;
      t.ai.state = "FIGHT";
    }
  }

  if(rawDmg >= 1) {
    const text = "-" + Math.round(rawDmg);
    const color = damageSourceColor(attacker, t);
    spawnDamageNumber(t.x, t.z, text, color);
    if(isMultiplayer && isLobbyLeader) {
      outgoingSeq++;
      broadcastToPeers({ type: "DAMAGE_EVENT", id: myNetId, seq: outgoingSeq, x: t.x, z: t.z, text, color, attackerId: attacker ? attacker.netId : null });
    }
  }
  if(rawDmg >= 5) spawnSparks(t.x, t.z, 0xffaa55, 6);

  if(t === pl) {
    applyLocalHitFeedback(rawDmg);
  } else if(attacker === pl) {
    screenShake = Math.min(13, screenShake + Math.min(7, rawDmg * 0.24));
    if(rawDmg >= 5) localHitStopFrames = Math.max(localHitStopFrames, 2);
    playHitConfirm();
  }

  if(t.hp <= 0 && t.ci === 6 && t.form === 0 && !t.armorBreakUsed) { breakArmor(t, a); return; } // armor can break only once
  if(t.hp <= 0) {
    t.hp = 0;
    t.dead = true;
    t.deathTime = matchTime;
    t.killedBy = attacker ? attacker.netId : "storm";
    let killMeta = { streak: 0, multi: 0 };
    if(attacker && attacker !== t) {
      attacker.kills++;
      attacker.killChain = matchTime - attacker.lastKillTime <= 3.5 ? attacker.killChain + 1 : 1;
      attacker.killStreak++;
      attacker.lastKillTime = matchTime;
      killMeta = { streak: attacker.killStreak, multi: attacker.killChain };
      if(attacker.netId === myNetId) awardShinies(SHINY_REWARDS.kill, "Elimination");
    }
    Snd.play("death");
    addKillFeed(attacker && attacker !== t ? attacker : null, t, killMeta);
    if(isMultiplayer && isLobbyLeader) {
      outgoingSeq++;
      broadcastToPeers({
        type: "KILL_EVENT", id: myNetId, seq: outgoingSeq,
        attackerId: attacker && attacker !== t ? attacker.netId : null,
        attackerCi: attacker && attacker !== t ? attacker.ci : null,
        attackerName: attacker && attacker !== t ? attacker.username : null,
        victimId: t.netId, victimCi: t.ci,
        victimName: t.username,
        streak: killMeta.streak, multi: killMeta.multi
      });
    }
    if(t.mesh) t.mesh.visible = false;
    if(t.emoteSprite) { disposeHierarchy(t.emoteSprite); t.emoteSprite = null; }
    if(t === pl || attacker === pl) screenShake = Math.max(screenShake, t === pl ? 20 : 13);
    spawn3DRing(t.x, t.z, 50, 0xff3838);
    spawnSparks(t.x, t.z, 0xff4438, 14);

    if(attacker && !attacker.dead) {
      const healAmt = Math.round(attacker.mhp * 0.15);
      attacker.hp = Math.min(attacker.mhp, attacker.hp + healAmt);
      spawnDamageNumber(attacker.x, attacker.z, "+" + healAmt + " HP", "#45d988");
      spawn3DRing(attacker.x, attacker.z, 28, 0x45d988);
    }

    // Spectating / match-end handling happens at the end of upd()
    if(t === spectateTarget) findNextSpectateTarget(1);
  }
}

function melee(e, rng, d, kb, noReflect) {
  e.swing = 0.25;
  spawn3DRing(e.x, e.z, rng, 0xffb042);
  if(isMultiplayer && !isLobbyLeader) return;

  for(const t of E) {
    if(t !== e && !t.dead) {
      const targetPos = getCombatPosition(t, e);
      const dx = targetPos.x - e.x, dz = targetPos.z - e.z;
      if(Math.hypot(dx, dz) < rng + t.r) {
        let da = Math.atan2(dz, dx) - e.a;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        if(Math.abs(da) < 1.15 && hasLOS(e.x, e.z, targetPos.x, targetPos.z) && areEnemies(e, t)) {
          hurt(t, d, Math.atan2(dz, dx), kb, e);
          if(!noReflect) t.slow = 0.7;
        }
      }
    }
  }
  const c = worldCrate;
  if(c && c.bombT === null && (!isMultiplayer || isLobbyLeader)) {
    const dx = c.x - e.x, dz = c.z - e.z, d = Math.hypot(dx, dz);
    let da = Math.atan2(dz, dx) - e.a; da = Math.atan2(Math.sin(da), Math.cos(da));
    if(d < rng + c.r && Math.abs(da) < 1.15 && hasLOS(e.x, e.z, c.x, c.z)) damageWorldCrate(35, e);
  }
  if(!isMultiplayer || isLobbyLeader) {
    for(const h of Husks) {
      const hx = h.x - e.x, hz = h.z - e.z;
      let ha = Math.atan2(hz, hx) - e.a; ha = Math.atan2(Math.sin(ha), Math.cos(ha));
      if(h.owner !== e && Math.hypot(hx, hz) < rng + 14 && Math.abs(ha) < 1.15) { h.hp -= d; spawnSparks(h.x, h.z, 0xaab2c0, 3); }
    }
  }
  if(!noReflect) reflect(e, rng);
}

function reflect(e, r) {
  for(const p of P) {
    if(p.o !== e && Math.hypot(p.x - e.x, p.z - e.z) < r + 15) {
      let da = Math.atan2(p.z - e.z, p.x - e.x) - e.a;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if(Math.abs(da) < 1.25) {
        spawn3DRing(p.x, p.z, 20, 0xffffff);
        if(p.t === "b") {
          p.life = 0;
        } else {
          const spd = Math.hypot(p.vx, p.vz) * 1.1;
          p.vx = Math.cos(e.a) * spd;
          p.vz = Math.sin(e.a) * spd;
          p.o = e;
          p.hit.clear();
          p.life = Math.min(p.life + 0.3, 1.2);
        }
      }
    }
  }
}

function shot(e, a, o) {
  e.fire = 0.22;
  const startX = o.x !== undefined ? o.x : (e.x + Math.cos(a)*18);
  const startZ = o.z !== undefined ? o.z : (e.z + Math.sin(a)*18);

  const mesh = spawnProjectileMesh(o.t);
  mesh.position.set(startX, 14, startZ);
  if(GFX[gfxLevel].glow && GLOW_COLORS[o.t]) {
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(), color: GLOW_COLORS[o.t], transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    glow.scale.set(17, 17, 1);
    mesh.add(glow);
  }

  P.push(Object.assign({
    x: startX,
    z: startZ,
    vx: Math.cos(a)*o.s,
    vz: Math.sin(a)*o.s,
    o: e,
    hit: new Set(),
    rot: 0,
    age: 0,
    out: true,
    mesh
  }, o));
}

function dentleyGuardActive(e) {
  return !!(e && e.ci === 6 && e.form === 0 && e.guard > 0);
}

function executeAttack(e) {
  if(dentleyGuardActive(e)) return;
  const c = HEROES[e.ci];
  e.c1 = c.cd;
  Snd.play(c.melee ? "melee" : "shoot");
  if(e.ci === 6) {
    dentleyAttack(e);
  } else if(c.melee) {
    melee(e, 80, 30, 360);

  } else if(e.ci === 4) {
    shot(e, e.a + (Math.random()-0.5)*0.14, {t:"s", s:540, d:8, kb:35, life:0.48});

function scheduleShot(e, delay, opts) {

// --- CAPTAIN OINK: CHAIN HOOK ---
// out:       chain flies forward (Oink is invulnerable and rooted)
// pullSelf:  hit a wall -> Oink zips to it (invulnerable)
// pullEnemy: hit a player -> that player is yanked to Oink and stunned (invulnerable)
// retract:   hit nothing -> chain reels back in, Oink is VULNERABLE and rooted
const _cUp = new THREE.Vector3(0, 1, 0), _cDir = new THREE.Vector3();

function startChain(e) {
  if(e.chain) return;
  const grp = new THREE.Group();
  const link = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.5, 1, 6),
    new THREE.MeshStandardMaterial({ color: 0xaab2c0, metalness: 0.9, roughness: 0.3 })
  );
  const hook = new THREE.Mesh(
    new THREE.SphereGeometry(4.2, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x4a5060, metalness: 0.9, roughness: 0.25 })
  );
  grp.add(link, hook);
  grp.link = link; grp.hook = hook;
  scene.add(grp);
  e.chain = { phase: "out", a: e.a, ox: e.x, oz: e.z, len: 0, tx: e.x, tz: e.z, t: 0, target: null, inv: true, mesh: grp };
}

function drawChain(e) {
  const c = e.chain, g = c.mesh;
  const fromX = c.phase === "pullSelf" ? e.x : c.ox;
  const fromZ = c.phase === "pullSelf" ? e.z : c.oz;
  _cDir.set(c.tx - fromX, 0, c.tz - fromZ);
  const L = _cDir.length();
  g.hook.position.set(c.tx, 14, c.tz);
  if(L < 0.5) { g.link.visible = false; return; }
  g.link.visible = true;
  _cDir.divideScalar(L);
  g.link.quaternion.setFromUnitVectors(_cUp, _cDir);
  g.link.scale.set(1, L, 1);
  g.link.position.set((fromX + c.tx) / 2, 14, (fromZ + c.tz) / 2);
}

function updateChain(e, dt) {
  const c = e.chain;
  if(c.inv) e.stun = 0; // invulnerable also means nothing can stun him mid-hook
  const auth = !isMultiplayer || isLobbyLeader;
  const cs = Math.cos(c.a), sn = Math.sin(c.a);
  c.t += dt;
  let done = false;

  if(c.phase === "out") {
    let move = CHAIN.outSpd * dt;
    while(move > 0 && c.phase === "out") {
      const step = Math.min(8, move);
      move -= step;
      const nl = c.len + step;
      const nx = c.ox + cs * nl, nz = c.oz + sn * nl;
      if(blocked(nx, nz, 2)) { // hit a wall: pull yourself to it
        c.phase = "pullSelf"; c.t = 0;
        Snd.play("bounce");
        spawnSparks(c.tx, c.tz, 0xdde4f0, 6);
        break;
      }
      c.len = nl; c.tx = nx; c.tz = nz;
      for(const t of E) {
        const targetPos = getCombatPosition(t, e);
        if(t !== e && !t.dead && areEnemies(e, t) && Math.hypot(targetPos.x - nx, targetPos.z - nz) < t.r + 7) {
          c.phase = "pullEnemy"; c.target = t; c.t = 0; // hit a player: pull them in
          Snd.play("bounce");
          break;
        }
      }
      if(c.phase === "out" && c.len >= CHAIN.max) { // hit nothing: reel it back, vulnerable
        c.phase = "retract"; c.t = 0; c.inv = false;
      }
    }
  } else if(c.phase === "pullSelf") {
    // Only the machine that controls Oink moves him; everyone else sees him arrive via the network
    if(e === pl || e.ai) {
      e.x += cs * CHAIN.pullSelfSpd * dt;
      e.z += sn * CHAIN.pullSelfSpd * dt;
    }
    if(Math.hypot(c.tx - e.x, c.tz - e.z) <= e.r + 6 || c.t > 0.7) done = true;
  } else if(c.phase === "pullEnemy") {
    const t = c.target;
    if(!t || t.dead) {
      done = true;
    } else {
      const dx = e.x - t.x, dz = e.z - t.z, d = Math.hypot(dx, dz) || 1;
      c.tx = t.x; c.tz = t.z;
      const arrived = d <= e.r + t.r + 10;
      if(auth) {
        if(arrived) { t.kx *= 0.2; t.kz *= 0.2; }
        else {
          t.kx = dx / d * CHAIN.pullEnemySpd;
          t.kz = dz / d * CHAIN.pullEnemySpd;
          t.stun = Math.max(t.stun, 0.4);
        }
      }
      if(arrived || c.t > 0.7) {
        if(auth) t.stun = Math.max(t.stun, 0.9); // "a little bit" of stun once they land
        done = true;
      }
    }
  } else { // retract
    const f = Math.min(1, c.t / CHAIN.retractTime);
    const L = c.len * (1 - f);
    c.tx = c.ox + cs * L; c.tz = c.oz + sn * L;
    if(f >= 1) done = true;
  }

  if(done) {
    endChain(e);
    spawn3DRing(e.x, e.z, 22, 0xaab2c0);
    return;
  }
  drawChain(e);
}

function inVisionCone(observer, tx, tz, maxFov = 1.67) {
  const dx = tx - observer.x;
  const dz = tz - observer.z;
  const angleToTarget = Math.atan2(dz, dx);
  let diff = angleToTarget - observer.a;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  return Math.abs(diff) <= (maxFov / 2);
}

function updateAI(e, dt) {
  e.ai.timer -= dt;
  e.ai.strafeTimer -= dt;
  if(e.ai.alertTimer > 0) e.ai.alertTimer -= dt;

  if(e.ai.strafeTimer <= 0) {
    if(Math.random() < 0.35) e.ai.strafeDir *= -1;
    e.ai.strafeTimer = 0.8 + Math.random()*1.0;
  }

  if(!e.ai.currentTarget || e.ai.currentTarget.dead || (teamMode && e.ai.currentTarget.team === e.team)) {
    let bestScore = 1e9, found = null;
    for(const o of E) {
      if(o !== e && !o.dead && !(teamMode && o.team === e.team)) {
        const d = Math.hypot(o.x - e.x, o.z - e.z);
        const visible = (inVisionCone(e, o.x, o.z, e.ai.fov) || d < 65) && hasLOS(e.x, e.z, o.x, o.z);
        const hpRatio = o.hp / Math.max(1, o.mhp);
        const score = d * (1 - e.ai.weakTargetBias * (1 - hpRatio) * 0.55);
        if(visible && score < bestScore) {
          bestScore = score;
          found = o;
        }
      }
    }
    e.ai.currentTarget = found;
  } else {
    const hasSight = hasLOS(e.x, e.z, e.ai.currentTarget.x, e.ai.currentTarget.z);
    if(!hasSight && e.ai.alertTimer <= 0) {
      e.ai.currentTarget = null;
    }
  }

  if(e.ai.timer > 0) return [e.ai.mx, e.ai.mz, e.ai.at, e.ai.ab1, e.ai.ab2];
  e.ai.timer = e.ai.react;

  const isLowHP = (e.hp / e.mhp) < 0.32;
  let nearestPickup = null, bestPickDist = 1e9;
  for(const p of Pickups) {
    const d = Math.hypot(p.x - e.x, p.z - e.z);
    if(d < bestPickDist) { bestPickDist = d; nearestPickup = p; }
  }

  const distFromCenter = Math.hypot(e.x - W/2, e.z - H/2);
  const ringDanger = distFromCenter > stormRadius - 35;
  const seekHusk = e.ci === 6 && e.form === 1 && e.husk && e.husk.life > 1.2;
  if(seekHusk) { nearestPickup = e.husk; bestPickDist = Math.hypot(e.husk.x - e.x, e.husk.z - e.z); }

  if(ringDanger) e.ai.state = "RUN_CENTER";
  else if(seekHusk) e.ai.state = "SEEK_HEAL";
  else if(isLowHP && nearestPickup && bestPickDist < 360 && Math.random() < 0.72 * e.ai.pickupBias) e.ai.state = "SEEK_HEAL";
  else if(isLowHP && Math.random() < (0.78 - e.ai.risk * 0.62)) e.ai.state = "RETREAT";
  else if(e.ai.currentTarget) e.ai.state = "FIGHT";
  else e.ai.state = "WANDER";

  const c = HEROES[e.ci];
  let moveAng = e.a;
  let targetAng = e.a;

  if(e.ai.state === "RUN_CENTER") {
    moveAng = Math.atan2(H/2 - e.z, W/2 - e.x);
    targetAng = moveAng;
  } else if(e.ai.state === "SEEK_HEAL" && nearestPickup) {
    moveAng = Math.atan2(nearestPickup.z - e.z, nearestPickup.x - e.x);
    targetAng = moveAng;
  } else if(e.ai.state === "WANDER") {
    if(Math.random() < 0.15) {
      e.a += (Math.random() - 0.5) * 1.2;
    }
    moveAng = e.a;
    targetAng = e.a;
  } else if(e.ai.currentTarget) {
    const t = e.ai.currentTarget;
    const targetDist = Math.hypot(t.x - e.x, t.z - e.z);
    targetAng = Math.atan2(t.z - e.z, t.x - e.x);

    if(e.ai.state === "RETREAT") {
      moveAng = targetAng + Math.PI + (e.ai.strafeDir * 0.4);
    } else {
      const basePrefDist = c.prefDist !== undefined ? c.prefDist : (c.melee ? 30 : 200 - (e.ai.aggro * 80));
      const prefDist = c.melee ? basePrefDist : basePrefDist * e.ai.rangeBias;
      if(targetDist < prefDist - 35) moveAng = targetAng + Math.PI;
      else if(targetDist > prefDist + 25) moveAng = targetAng;
      else moveAng = targetAng + (Math.PI/2 * e.ai.strafeDir);
    }
  }

  if(worldCrate && worldCrate.bombT !== null && !worldCrate.exploded) {
    const bombDist = Math.hypot(e.x - worldCrate.x, e.z - worldCrate.z);
    if(bombDist < 135) moveAng = Math.atan2(e.z - worldCrate.z, e.x - worldCrate.x);
  }

  let da = targetAng - e.a;
  da = Math.atan2(Math.sin(da), Math.cos(da));
  e.a += da * 0.45;

  if(blocked(e.x + Math.cos(moveAng)*38, e.z + Math.sin(moveAng)*38, e.r)) {
    moveAng += Math.PI/2 * e.ai.strafeDir;
  }

  const targetVx = Math.cos(moveAng);
  const targetVz = Math.sin(moveAng);
  e.ai.mx += (targetVx - e.ai.mx) * 0.35;
  e.ai.mz += (targetVz - e.ai.mz) * 0.35;

  const target = e.ai.currentTarget;
  const canSeeTarget = target && inVisionCone(e, target.x, target.z, e.ai.fov) && hasLOS(e.x, e.z, target.x, target.z);
  const targetDist = target ? Math.hypot(target.x - e.x, target.z - e.z) : 999;

  e.ai.at = (canSeeTarget && targetDist < (c.atkRange || (c.melee ? 85 : 360)) && Math.random() < e.ai.attackBias) ? 1 : 0;
  const abilityDistance = canSeeTarget && targetDist < (c.ab1Range || (c.melee ? 110 : 200));
  const ultimateDistance = canSeeTarget && targetDist < (c.ab2Range || (c.melee ? 150 : 240));
  e.ai.ab1 = (abilityDistance && Math.random() < 0.22 * e.ai.abilityBias) ? 1 : 0;
  e.ai.ab2 = (ultimateDistance && Math.random() < 0.18 * e.ai.abilityBias) ? 1 : 0;

  return [e.ai.mx, e.ai.mz, e.ai.at, e.ai.ab1, e.ai.ab2];
}

function syncHUD() {

      ? `<div class="stats-table">` + sorted.map((s, idx) => {

        }).join("") + `</div>`
      : "";
  }
}

// The host (or solo play) decides the winner and tells every connected player.
function endMatch(winnerId, winnerTeam = null) {
  if(matchOver) return;
  matchOver = true;
  const stats = E.map(e => ({
    id: e.netId, ci: e.ci, username: e.username, k: e.kills, d: Math.round(e.dmg),
    t: Math.round(e.dead ? (e.deathTime || 0) : matchTime), dead: e.dead
  }));
  if(isMultiplayer && isLobbyLeader) {
    outgoingSeq++;
    broadcastToPeers({ type: "MATCH_END", winnerId, winnerTeam, stats, seq: outgoingSeq });
  }
  const iWon = teamMode
    ? (winnerTeam !== null && winnerTeam !== undefined && pl && pl.team === winnerTeam)
    : (winnerId !== null && winnerId !== undefined && winnerId === myNetId);
  showResultScreen(iWon, winnerId, stats);
}

// --- NETWORKING LOGIC ---
function gen4LetterCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let res = "";
  for(let i = 0; i < 4; i++) res += chars[Math.floor(Math.random() * chars.length)];
  return res;
}

function sendActionIntent(act, a, x, z) {
  if(hostVisibilityPaused && isMultiplayer) return;
  outgoingSeq++;
  const packet = { type: "ACTION_INTENT", id: myNetId, act, a, x, z, seq: outgoingSeq };
  if(isLobbyLeader) {
    broadcastToPeers(packet);
  } else if(leaderId && peerConnections.has(leaderId)) {
    const conn = peerConnections.get(leaderId);
    if(conn && conn.open) conn.send(packet);
  }
}

function peerRttMs(conn) {
  if(conn && Number.isFinite(conn.rttMs) && Date.now() - (conn.rttAt || 0) < 6000) {
    return Math.max(20, Math.min(700, conn.rttMs));
  }
  return 120;
}

function actionCooldownSlack(conn) {
  return Math.min(0.38, peerRttMs(conn) / 2000 + 0.04);
}

function actionHitRewind(conn) {
  return Math.min(300, Math.max(70, peerRttMs(conn) / 2 + 55));
}

function actionPose(ent, data, validate = false) {
  if(!Number.isFinite(data.x) || !Number.isFinite(data.z) || !Number.isFinite(data.a)) return null;
  if(data.x < B + 4 || data.z < B + 4 || data.x > W - B - 4 || data.z > H - B - 4) return null;
  if(validate) {
    const refX = Number.isFinite(ent.targetX) ? ent.targetX : ent.x;
    const refZ = Number.isFinite(ent.targetZ) ? ent.targetZ : ent.z;
    const allowance = Math.max(36, Math.min(72, HEROES[ent.ci].sp * 0.28 + 22));
    if(Math.hypot(data.x - refX, data.z - refZ) > allowance) return null;
  }
  return { x: data.x, z: data.z, a: Math.atan2(Math.sin(data.a), Math.cos(data.a)) };
}

function executeIntentAtPose(ent, data, pose) {
  const oldX = ent.x, oldZ = ent.z;
  const oldKx = ent.kx, oldKz = ent.kz, oldChargeT = ent.chargeT;
  ent.x = pose.x;
  ent.z = pose.z;
  ent.a = pose.a;
  ent.targetA = pose.a;

  if(data.act === "ATTACK") executeAttack(ent);
  else if(data.act === "AB1") executeAbility1(ent);
  else if(data.act === "AB2") executeAbility2(ent);

  const abilityMoved = ent.x !== pose.x || ent.z !== pose.z ||
    ent.kx !== oldKx || ent.kz !== oldKz || ent.chargeT > oldChargeT;
  if(abilityMoved) {
    ent.targetX = ent.x;
    ent.targetZ = ent.z;
  } else {
    ent.x = oldX;
    ent.z = oldZ;
  }
}

const HOST_DISCONNECT_MESSAGE = "Sorry, the host disconnected or was removed from the match. Please try again.";

function leaveLobby(msg) {
  msg = String(msg || "").replace(/[<>]/g, "");
  Snd.musicStop();
  if(peer) peer.destroy();
  peer = null;
  isMultiplayer = false;
  isLobbyLeader = false;
  hostVisibilityPaused = false;
  setHostPauseBanner(false);
  leaderId = null;
  peerConnections.clear();
  roster = [];
  lastSeenByPeer.clear();
  lastSeqByPeer.clear();
  quickMatchRooms = null;
  quickMatchHosted = false;
  quickMatchAutoStart = null;
  qmClientCountdown = null;
  qmRendezvousStarted = false;
  qmQuerying = false;
  qmActiveConn = null;
  qmGen++; // invalidate all in-flight search callbacks (claims, probes, joins)
  disarmQmWatchdog(); // search cancelled — disarm the watchdog
  remotePickupMeshes.forEach(m => disposeHierarchy(m));
  remotePickupMeshes.clear();
  // Full teardown: stop the simulation and clear match state before showing the menu
  matchOver = true;
  state = "menu";
  isSpectating = false;
  spectateTarget = null;
  clearHeldInputs();
  if(document.pointerLockElement) {
    try { document.exitPointerLock(); } catch(e) {}
  }
  clearSceneEntities();
  pl = null;
  setupViewmodel(null);
  menu(msg);
}

function setupConnectionEvents(conn) {
  conn.on("open", () => {
    peerConnections.set(conn.peer, conn);
    lastSeenByPeer.set(conn.peer, Date.now());
    outgoingSeq++;
    conn.send({ type: "HELLO", id: myNetId, hero: p1HeroChoice, username: activeUsername(), tagCosmetics: getNameplateCosmeticIds(), skins: getSkinSelection(), seq: outgoingSeq });
  });

  conn.on("data", data => {
    lastSeenByPeer.set(conn.peer, Date.now());
    handleIncomingData(conn, data);
  });

  conn.on("close", () => {
    peerConnections.delete(conn.peer);
    lastSeenByPeer.delete(conn.peer);
    roster = roster.filter(r => r.id !== conn.peer);
    removePeerEntity(conn.peer);

    // Keep every client's roster in sync when someone leaves
    if(isLobbyLeader) {
      outgoingSeq++;
      broadcastToPeers({ type: "ROSTER_SYNC", roster, leaderId, seq: outgoingSeq });
    }

    // A failed Quick Match join attempt (room gone or rejected) — try the next room.
    // Only the connection driving the CURRENT attempt may advance the search, so a
    // stale close event (e.g. after a timeout already moved on) can't double-advance.
    if(quickMatchRooms && !isLobbyLeader) {
      if(conn !== qmActiveConn) return;
      qmActiveConn = null;
      qmSeq++;
      tryNextQuickMatchRoom();
      return;
    }

    // Clients only ever connect to the host, so a real host migration isn't
    // possible — end the session cleanly instead of pretending to elect a new leader.
    if(conn.peer === leaderId && isMultiplayer && !isLobbyLeader) {
      leaveLobby(HOST_DISCONNECT_MESSAGE);
      return;
    }
    if(state === "menu") refreshLobbyMenu();
  });

  conn.on("error", () => {
    peerConnections.delete(conn.peer);
    if(conn.peer === leaderId && isMultiplayer && !isLobbyLeader) {
      leaveLobby(HOST_DISCONNECT_MESSAGE);
    }
  });
}

function setHostPauseBanner(paused) {
  const banner = document.getElementById("host-paused-banner");
  if(banner) banner.classList.toggle("show", !!paused);
}

function handleIncomingData(conn, data) {
  if(!data || !data.type) return;

  if(data.type === "PING") {
    conn.send({ type: "PONG", sentAt: data.sentAt });
    return;
  }
  if(data.type === "PONG") {
    if(Number.isFinite(data.sentAt) && conn.pendingPings && conn.pendingPings.has(data.sentAt)) {
      const sample = Date.now() - data.sentAt;
      if(sample >= 0 && sample <= 2000) {
        conn.rttMs = Number.isFinite(conn.rttMs) ? conn.rttMs * 0.7 + sample * 0.3 : sample;
        conn.rttAt = Date.now();
      }
      conn.pendingPings.delete(data.sentAt);
    }
    return;
  }
  if(data.type === "REJECT") {
    // During Quick Match, a full/underway lobby just means "try the next room";
    // the host closes the connection right after, which triggers the next attempt.
    if(quickMatchRooms) return;
    leaveLobby(data.reason || "Lobby full.");
    return;
  }

  if(data.seq !== undefined && data.id && !isNewPacket(data.id, data.type, data.seq)) {
    return;
  }

  if(data.type === "HOST_PAUSE") {
    if(isLobbyLeader || data.id !== leaderId) return;
    hostVisibilityPaused = !!data.paused;
    setHostPauseBanner(hostVisibilityPaused);
    if(!hostVisibilityPaused) lastT = performance.now();
    return;
  }

  if(data.type === "HELLO") {
    if(isLobbyLeader && data.id !== conn.peer) return;
    const hero = Number.isInteger(data.hero) && data.hero >= RANDOM_HERO && data.hero < HEROES.length ? data.hero : 0;
    let r = roster.find(x => x.id === data.id);
    const username = safeNetworkUsername(data.username || (r && r.username) || "Player", data.id);
    const duplicateName = roster.find(player => player.id !== data.id && String(player.username || "").normalize("NFKC").trim().toLocaleLowerCase() === username.toLocaleLowerCase());
    if(isLobbyLeader && duplicateName) {
      try { conn.send({ type: "REJECT", reason: "That username is already being used in this lobby." }); } catch(e) {}
      setTimeout(() => { try { conn.close(); } catch(e) {} }, 200);
      return;
    }
    const tagCosmetics = sanitizeCosmeticSelection(data.tagCosmetics || (r && r.tagCosmetics));
    const skins = sanitizeSkinSelection(data.skins || (r && r.skins));
    if(!r) {
      // Seat check happens again here so two simultaneous joiners can't overfill the lobby
      if(roster.length >= 6) {
        try { conn.send({ type: "REJECT", reason: "Lobby full" }); } catch(e) {}
        setTimeout(() => { try { conn.close(); } catch(e) {} }, 200);
        return;
      }
      roster.push({ id: data.id, hero, username, tagCosmetics, skins });
    } else {
      r.hero = hero;
      r.username = username;
      r.tagCosmetics = tagCosmetics;
      r.skins = skins;
    }
    if(isLobbyLeader) {
      outgoingSeq++;
      broadcastToPeers({ type: "ROSTER_SYNC", roster, leaderId, seq: outgoingSeq });
      // A brand-new member who arrived mid-round spectates the live match until the next one
      if(!r && (state === "play" || state === "countdown" || state === "intro")) {
        try {
          conn.send({
            type: "SPECTATE_MODE",
            mapIndex: selectedMapIndex,
            storm: Math.round(stormRadius),
            mtime: Math.round(matchTime * 10) / 10
          });
        } catch(e) {}
      }
    }
    if(state === "menu") refreshLobbyMenu();
  }
  else if(data.type === "ROSTER_SYNC") {
    // The host broadcasts roster updates to every open connection — including joiners
    // still waiting for admission. While quick-matching, only a roster that actually
    // contains us counts as "joined"; otherwise keep waiting (a REJECT or the join
    // timeout moves us on to the next room).
    if(quickMatchRooms && !(data.roster || []).some(r => r.id === myNetId)) return;
    quickMatchRooms = null; // joined successfully — normal lobby behavior from here
    disarmQmWatchdog();     // landed — disarm the search watchdog
    roster = data.roster;
    if(data.leaderId) {
      leaderId = data.leaderId;
      isLobbyLeader = (myNetId === leaderId);
    }
    if(state === "menu") refreshLobbyMenu();
  }
  else if(data.type === "LEADER_ELECTED") {
    leaderId = data.leaderId;
    isLobbyLeader = (myNetId === leaderId);
    if(state === "menu") refreshLobbyMenu();
  }
  else if(data.type === "QM_COUNTDOWN") {
    qmClientCountdown = data.remaining;
    if(state === "menu") refreshLobbyMenu();
  }
  else if(data.type === "SPECTATE_MODE") {
    if(isLobbyLeader) return;
    quickMatchRooms = null; // joined successfully — normal lobby behavior from here
    disarmQmWatchdog();     // landed — disarm the search watchdog
    enterSpectateLobby(data);
  }
  else if(data.type === "START_GAME") {
    if(quickMatchRooms) return; // still joining — ignore games we haven't been admitted to
    selectedMapIndex = Number.isInteger(data.mapIndex) && MAPS[data.mapIndex] ? data.mapIndex : 0;
    launchMeshMatch(
      data.spawns && typeof data.spawns === "object" ? data.spawns : {},
      data.heroes && typeof data.heroes === "object" ? data.heroes : {},
      data.identities && typeof data.identities === "object" ? data.identities : {}
    );
  }
  else if(data.type === "CLIENT_INPUT") {
    if(!isLobbyLeader || hostVisibilityPaused || data.id !== conn.peer ||
       !Number.isFinite(data.x) || !Number.isFinite(data.z) || !Number.isFinite(data.a)) return;
    const ent = getRemoteActorByNetId(data.id);
    if(ent && !ent.dead) {
      ent.targetX = data.x;
      ent.targetZ = data.z;
      ent.targetA = data.a;
      ent.targetP = data.p || 0;
    }
  }
  else if(data.type === "SNAPSHOT") {
    if(isLobbyLeader) return;
    if(state !== "play" && state !== "countdown" && state !== "intro") return;
    for(const item of data.entities) {
      if(item.id === myNetId) {
        if(pl) {
          // Local hit feedback + death handling from the authoritative host state
          if(item.hp < pl.hp && !pl.dead) applyLocalHitFeedback(pl.hp - item.hp);
          pl.hp = item.hp;
          pl.mhp = item.mh || pl.mhp; pl.form = item.fm || 0;
          pl.guard = item.gd || 0; pl.riposte = item.rp || 0;
          // Replicate host-applied status effects so stuns/slows/poison actually stop a client
          pl.stun = Math.max(pl.stun, item.st || 0);
          pl.slow = Math.max(pl.slow, item.sl || 0);
          pl.sporePoison = Math.max(pl.sporePoison, item.po || 0);
          pl.speedBoost = Math.max(pl.speedBoost, item.sb || 0);
          pl.kx = item.kx || 0;
          pl.kz = item.kz || 0;
          if(item.dead && !pl.dead) {
            pl.dead = true;
            pl.deathTime = matchTime;
            pl.killedBy = item.kl || "storm";
            if(pl.mesh) pl.mesh.visible = false;
            Snd.play("death");
          }
        }
        continue;
      }

      let ent = getRemoteActorByNetId(item.id);
      if(!ent && !item.dead) {
        ent = mk(item.ci, item.x, item.z, 2, item.id, null, item.un, item.tc, { championSkins: { [item.ci]: item.cs || "default" }, weaponSkins: { [item.ci]: item.ws || "default" } });
        E.push(ent);
      }
      if(ent) {
        if(item.un !== undefined || item.tc !== undefined) setEntityIdentity(ent, item.un, item.tc);
        if(item.cs !== undefined || item.ws !== undefined) {
          const skinUpdate = sanitizeSkinSelection(ent.skins);
          if(item.cs !== undefined) skinUpdate.championSkins[item.ci] = item.cs;
          if(item.ws !== undefined) skinUpdate.weaponSkins[item.ci] = item.ws;
          setEntitySkins(ent, skinUpdate);
        }
        if(item.dead && !ent.dead) {
          ent.dead = true;
          ent.deathTime = matchTime;
          Snd.play("death");
        }
        ent.targetX = item.x;
        ent.targetZ = item.z;
        ent.targetA = item.a;
        ent.targetP = item.p || 0;
        ent.hp = item.hp;
        ent.mhp = item.mh || ent.mhp; ent.form = item.fm || 0;
        ent.guard = item.gd || 0; ent.riposte = item.rp || 0;
        ent.dead = item.dead;
        ent.stun = item.st || 0;
        ent.slow = item.sl || 0;
        if(ent.dead && ent.mesh) ent.mesh.visible = false;
      }
    }
    syncRemotePickups(data.pickups || []);
    syncRemoteCrate(data.crate || null);
    syncRemoteHusks(data.husks || []);
    // Authoritative storm state (keeps mid-round spectators in sync with the host)
    if(data.storm !== undefined) stormRadius = data.storm;
  }
  else if(data.type === "DAMAGE_EVENT") {
    if(!isLobbyLeader) {
      spawnDamageNumber(data.x, data.z, String(data.text || "-1"), data.color || "#ff5544");
      if(data.attackerId === myNetId) {
        screenShake = Math.min(13, screenShake + 2.2);
        localHitStopFrames = Math.max(localHitStopFrames, 2);
        playHitConfirm();
      }
    }
  }
  else if(data.type === "KILL_EVENT") {
    if(!isLobbyLeader) {
      const victim = getRemoteActorByNetId(data.victimId) || { ci: data.victimCi, username: data.victimName };
      const killer = data.attackerId
        ? (getRemoteActorByNetId(data.attackerId) || { ci: data.attackerCi, username: data.attackerName })
        : null;
      if(killer && !killer.username) killer.username = data.attackerName || null;
      if(data.attackerId === myNetId) awardShinies(SHINY_REWARDS.kill, "Elimination");
      addKillFeed(killer, victim, { streak: data.streak || 0, multi: data.multi || 0 });
    }
  }
  else if(data.type === "MATCH_END") {
    if(isLobbyLeader) return;
    if(state !== "play" && state !== "countdown" && state !== "intro") return;
    const iWon = data.winnerId === myNetId ||
      (data.winnerTeam != null && data.winnerTeam !== undefined && pl && pl.team === data.winnerTeam);
    showResultScreen(iWon, data.winnerId, data.stats || []);
  }
  else if(data.type === "ACTION_INTENT") {
    if(hostVisibilityPaused) return;
    const ent = getRemoteActorByNetId(data.id);
    let accepted = !isLobbyLeader;
    if(isLobbyLeader) {
      accepted = false;
      if(data.id !== conn.peer || !ent || ent.dead) return;
      if(data.act === "EMOTE") {
        accepted = executeEmote(ent, Math.round(data.a));
      } else {
        const pose = actionPose(ent, data, true);
        if(!pose) return;
        const slack = actionCooldownSlack(conn);
        if(data.act === "ATTACK" && ent.c1 <= slack) accepted = true;
        else if(data.act === "AB1" && ent.c2 <= slack) accepted = true;
        else if(data.act === "AB2" && ent.c3 <= slack) accepted = true;
        if(accepted) {
          ent.hitRewindMs = actionHitRewind(conn);
          executeIntentAtPose(ent, data, pose);
        }
      }
    } else if(ent && !ent.dead) {
      if(data.act === "EMOTE") accepted = executeEmote(ent, Math.round(data.a));
      else {
        const pose = actionPose(ent, data);
        if(pose && ["ATTACK", "AB1", "AB2"].includes(data.act)) executeIntentAtPose(ent, data, pose);
      }
    }
    if(isLobbyLeader && accepted) {
      peerConnections.forEach((pConn, pid) => {
        if(pid !== conn.peer && pConn.open) {
          pConn.send(data);
        }
      });
    }
  }
}

function broadcastToPeers(obj) {
  peerConnections.forEach(conn => {
    if(conn && conn.open) conn.send(obj);
  });
}

// Host snapshots run at 30 Hz to keep remote aim and movement close to what clients see.
setInterval(() => {
  if(isMultiplayer && isLobbyLeader && (state === "play" || state === "countdown" || state === "intro")) {
    outgoingSeq++;
    const snapEntities = E.map(e => ({
      id: e.netId,
      ci: e.ci,
      x: e.x,
      z: e.z,
      a: e.a,
      p: e.pitch,
      hp: e.hp,
      dead: e.dead,
      st: e.stun > 0 ? e.stun : 0,
      sl: e.slow > 0 ? e.slow : 0,
      po: e.sporePoison > 0 ? e.sporePoison : 0,
      sb: e.speedBoost > 0 ? e.speedBoost : 0,
      kx: Math.round(e.kx),
      kz: Math.round(e.kz),
      kl: e.killedBy,
      fm: e.form, mh: e.mhp, gd: e.guard > 0 ? e.guard : 0, rp: e.riposte,
      un: e.username, tc: e.tagCosmetics,
      cs: e.skins && e.skins.championSkins ? e.skins.championSkins[e.ci] : "default",
      ws: e.skins && e.skins.weaponSkins ? e.skins.weaponSkins[e.ci] : "default"
    }));
    broadcastToPeers({
      type: "SNAPSHOT",
      seq: outgoingSeq,
      entities: snapEntities,
      pickups: Pickups.map(pk => ({ id: pk.uid, k: pk.kind, x: pk.x, z: pk.z })),
      husks: Husks.map(h => ({ id: h.id, x: h.x, z: h.z, hp: h.hp, l: h.life })),
      crate: worldCrate ? { id:worldCrate.id, x:worldCrate.x, z:worldCrate.z, hp:worldCrate.hp, bombT:worldCrate.bombT, exploded:!!worldCrate.exploded } : null,
      storm: Math.round(stormRadius)
    });
  }
}, 33);

// Client movement uploads at 60 Hz so the host has a fresh movement and aim sample.
setInterval(() => {
  if(isMultiplayer && !isLobbyLeader && !hostVisibilityPaused && pl && !pl.dead && (state === "play" || state === "countdown")) {
    outgoingSeq++;
    const packet = {
      type: "CLIENT_INPUT",
      id: myNetId,
      seq: outgoingSeq,
      x: pl.x,
      z: pl.z,
      a: pl.a,
      p: pl.pitch
    };
    if(leaderId && peerConnections.has(leaderId)) {
      const conn = peerConnections.get(leaderId);
      if(conn && conn.open) conn.send(packet);
    }
  }
}, 16);

// Heartbeat
setInterval(() => {
  if(isMultiplayer) {
    const pingPacket = { type: "PING", sentAt: Date.now() };
    if(isLobbyLeader) {
      peerConnections.forEach(conn => {
        if(!conn || !conn.open) return;
        if(!conn.pendingPings) conn.pendingPings = new Map();
        conn.pendingPings.set(pingPacket.sentAt, pingPacket.sentAt);
        while(conn.pendingPings.size > 5) conn.pendingPings.delete(conn.pendingPings.keys().next().value);
        conn.send(pingPacket);
      });
    } else if(leaderId && peerConnections.has(leaderId)) {
      const conn = peerConnections.get(leaderId);
      if(conn && conn.open) {
        if(!conn.pendingPings) conn.pendingPings = new Map();
        conn.pendingPings.set(pingPacket.sentAt, pingPacket.sentAt);
        while(conn.pendingPings.size > 5) conn.pendingPings.delete(conn.pendingPings.keys().next().value);
        conn.send(pingPacket);
      }
    }
  }
}, 1000);

// Peer disconnect cleaner
setInterval(() => {
  if(!isMultiplayer) return;
  const now = Date.now();
  for(const [id, lastSeen] of lastSeenByPeer.entries()) {
    if(id === leaderId && !isLobbyLeader && hostVisibilityPaused) continue;
    if(now - lastSeen > 6000) {
      removePeerEntity(id);
      roster = roster.filter(r => r.id !== id);
      const conn = peerConnections.get(id);
      if(conn) conn.close();
      peerConnections.delete(id);
      lastSeenByPeer.delete(id);

      if(id === leaderId && !isLobbyLeader) {
        // No client-to-client connections exist, so migration is impossible — close out.
        leaveLobby(HOST_DISCONNECT_MESSAGE);
        return;
      }
      if(isLobbyLeader) {
        outgoingSeq++;
        broadcastToPeers({ type: "ROSTER_SYNC", roster, leaderId, seq: outgoingSeq });
      }
      if(state === "menu") refreshLobbyMenu();
    }
  }
}, 1500);

// Shared host-side wiring: lobby rejection, room-code collision retry, error handling
function wireHostPeer() {
  peer.on("open", () => {
    refreshLobbyMenu();
  });

  peer.on("connection", conn => {
    // Quick Match population probe: answer with lobby status, never touch the roster
    if(conn.metadata && conn.metadata.qmQuery) {
      conn.on("open", () => {
        try {
          conn.send({
            type: "ROOM_INFO",
            players: roster.length,
            capacity: 6,
            phase: (state === "play" || state === "countdown" || state === "intro") ? "live" : "waiting"
          });
        } catch(e) {}
        setTimeout(() => { try { conn.close(); } catch(e) {} }, 300);
      });
      setTimeout(() => { try { conn.close(); } catch(e) {} }, 2500);
      return;
    }
    if(roster.length >= 6) {
      // Wait for the connection to open before sending the rejection
      conn.on("open", () => {
        try { conn.send({ type: "REJECT", reason: "Lobby full" }); } catch(e) {}
        setTimeout(() => { try { conn.close(); } catch(e) {} }, 200);
      });
      setTimeout(() => { try { conn.close(); } catch(e) {} }, 2500);
      return;
    }
    // Match underway with open seats: the newcomer joins as a spectator of the live round
    setupConnectionEvents(conn);
  });

  peer.on("error", err => {
    console.warn("Peer error:", err);
    if(err && err.type === "unavailable-id") {
      // Room code collision — immediately retry with a fresh code
      const wasQM = quickMatchHosted;
      hostMultiplayerLobby();
      if(wasQM) quickMatchHosted = true;
      return;
    }
    alert("Could not register room code. Try hosting again!");
    leaveLobby("Select a champion to battle in the arena!");
  });
}

window.joinMultiplayerLobby = function() {

  stopDemo();
  const codeIn = document.getElementById("lobby-code-in");
  const code = (codeIn ? codeIn.value : "").trim().toUpperCase();
  if(!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}$/.test(code)) {
    alert("Please enter a valid 4-character code!");
    return;
  }

    console.warn("Peer error:", err);
    alert("Could not find lobby. Double-check your code!");
    leaveLobby("Select a champion to battle in the arena!");
  });
};

// --- QUICK MATCH: join the open lobby with the most players (max 6), or host one if none exist ---
const QM_CODES = ["QM01", "QM02", "QM03", "QM04", "QM05", "QM06"];
let qmQuerying = false; // true while probing room populations (suppresses join-attempt error handling)
let qmActiveConn = null;  // the connection driving the current quick-match join attempt
let qmWatchdog = null;   // safety net: if a search is still running after 20s, recover instead of hanging
let qmRescued = false;   // first watchdog deadline already fired (recovery in progress)?
let qmGen = 0;           // search generation — invalidates stale async callbacks (claims, probes, joins)

// Arm/disarm the search watchdog. Disarmed on any successful landing (room admission,
// spectator admission, hosting) and on cancellation.
function armQmWatchdog(ms) {
  if(qmWatchdog) clearTimeout(qmWatchdog);
  // Timer-identity check: if this handle was replaced (re-arm / disarm) before it
  // fired, the scheduled callback is a no-op
  const t = setTimeout(() => { if(qmWatchdog === t) fireQmWatchdog(); }, ms);
  qmWatchdog = t;
}
function disarmQmWatchdog() {
  if(qmWatchdog) { clearTimeout(qmWatchdog); qmWatchdog = null; }
  qmRescued = false;
}
function fireQmWatchdog() {
  // Clear the scheduled timer before dropping its handle — a manually-fired
  // watchdog (e.g. the ensureLivePeer deadline) must not leave the original
  // deadline armed to fire again during recovery or a later search
  if(qmWatchdog) { clearTimeout(qmWatchdog); qmWatchdog = null; }
  // Landed (a REGISTERED host, or an admitted member) or cancelled — nothing to
  // recover. A host whose peer hasn't opened yet is NOT a safe landing: the
  // search must keep recovering rather than strand the player in an
  // unregistered (and possibly undiscoverable) lobby.
  const registeredHost = (quickMatchHosted || isLobbyLeader) && peer && peer.open;
  const admittedMember = !isLobbyLeader && !quickMatchHosted && isMultiplayer &&
                         roster.length > 0 && peerConnections.size > 0;
  if(registeredHost || admittedMember || !isMultiplayer) return;
  if(!qmRescued) {
    // First deadline: the search is stuck. Invalidate everything in flight (a stale
    // claim or join attempt must never take over after recovery) and retry with a
    // discoverable QM-code claim cascade — bounded at 6s per code, and other
    // quick-matchers probe these codes even when broker listing is down.
    qmRescued = true;
    qmGen++;                    // invalidate all in-flight search callbacks
    quickMatchRooms = null;     // disarm stuck join-attempt timers
    currentLobbyCode = null;    // no longer mid-join
    qmRendezvousStarted = false; // allow a fresh rendezvous
    // The old search peer is obsolete — destroy it so its late open/error callbacks
    // can never resume old work or touch the recovery's replacement peer
    try { if(peer) peer.destroy(); } catch(e) {}
    peer = null;
    console.warn("Quick Match search stalled — retrying with a room-code claim");
    armQmWatchdog(15000);       // hard deadline for the recovery itself
    quickMatchRendezvous(QM_CODES.slice());
  } else {
    // Recovery also failed — after ~35s the matchmaking service is most likely
    // unreachable (or every claim stalled). Don't strand the player in a lobby
    // nobody can discover or join: stop the search with a clear, retryable error.
    console.warn("Quick Match recovery timed out — stopping the search");
    leaveLobby("\u26A1 Quick Match couldn't reach the matchmaking service after several tries. \nPlease check your connection and try again!");
  }
}

// Ask a room how full it is without joining: a tiny connection that never sends
// HELLO and never touches the roster. Resolves {players, capacity, phase} or null.
function queryRoomStatus(roomId) {
  return new Promise(resolve => {
    let done = false;
    const finish = info => { if(done) return; done = true; resolve(info); };
    let conn = null;
    try { conn = peer.connect(roomId, { reliable: true, metadata: { qmQuery: true } }); } catch(e) {}
    if(!conn) { finish(null); return; }
    const timer = setTimeout(() => { try { conn.close(); } catch(e) {} finish(null); }, 2200);
    conn.on("open", () => { try { conn.send({ type: "ROOM_QUERY" }); } catch(e) {} });
    conn.on("data", d => {
      if(d && d.type === "ROOM_INFO") {
        clearTimeout(timer);
        finish(d); // settle the successful result before closing (the close listener also resolves)
        try { conn.close(); } catch(e) {}
      }
    });
    conn.on("error", () => { clearTimeout(timer); finish(null); });
    conn.on("close", () => { clearTimeout(timer); finish(null); });
  });
}

function handleQuickMatchPeerError(err) {
  console.warn("Peer error:", err);
  // A search is active from the first Quick Match click until we land (join/host)
  // or cancel — room-level errors during a search must never kill it
  const searching = !quickMatchHosted && !isLobbyLeader && isMultiplayer &&
                    (qmQuerying || quickMatchRooms || qmRendezvousStarted || qmWatchdog !== null);
  // "peer-unavailable" just means a target room vanished (dead host, stale broker
  // registration, or a probe straggler arriving late) — never fatal, and it never
  // advances the search: the error can't be reliably tied to the current connection,
  // so the join attempt's own 5s admission timeout decides when to move on.
  if(err && err.type === "peer-unavailable") {
    return;
  }
  // The public broker rejects peer listing with a server-error — fall back to rendezvous
  if(err && err.type === "server-error" && searching) {
    // The listing failure also severs this peer's signaling socket, and the disconnected
    // flag can lag behind — so destroy the peer outright; ensureLivePeer builds a fresh
    // one for the rendezvous probes (a dead socket would make every probe fail silently)
    try { if(peer) peer.destroy(); } catch(e) {}
    peer = null;
    if(!qmRendezvousStarted) startQuickMatchRendezvous();
    // else: the rendezvous is already in flight — its claim timeout and the search
    // watchdog guarantee the search can't hang forever from a second broker error
    return;
  }
  if(searching) {
    // Any other signaling error mid-search (network blip, disconnect): the watchdog
    // bounds the search — don't boot the player out of it with a modal error
    return;
  }
  alert("Quick Match connection error. Try again!");
  leaveLobby("Select a champion to battle in the arena!");
}

// The broker's listing server-error DISCONNECTS our peer, and a disconnected peer's
// connect() returns undefined — so rebuild a fresh peer before joining through it
function ensureLivePeer(then) {
  if(peer && !peer.destroyed && !peer.disconnected) { then(); return; }
  try { if(peer) peer.destroy(); } catch(e) {}
  myNetId = "brawlbound-client-" + Math.random().toString(36).substring(2, 8);
  const p = new Peer(myNetId); // captured identity: callbacks only ever touch this peer
  const gen = qmGen; // captured before waiting: this peer belongs to this search generation
  peer = p;
  p.on("connection", conn => setupConnectionEvents(conn));
  p.on("error", err => { if(peer === p && gen === qmGen) handleQuickMatchPeerError(err); }); // ignore zombie peers/searches
  if(p.open) { then(); return; }
  let opened = false;
  // A peer that never finishes opening must not hang the search — after 7s clean it
  // up (only this captured instance) and let the watchdog's recovery take over.
  // The captured peer is destroyed even on a stale generation; the watchdog fires
  // only for a live generation.
  const openDeadline = setTimeout(() => {
    if(opened) return;
    const stale = gen !== qmGen;
    if(peer === p) peer = null;
    try { p.destroy(); } catch(e) {}
    if(stale) return;
    fireQmWatchdog();
  }, 7000);
  p.on("open", () => {
    if(opened) return;
    opened = true;
    clearTimeout(openDeadline);
    // A stale generation (restart/recovery happened while opening) must never
    // resume obsolete search work — reject the callback and clean up this peer
    if(gen !== qmGen || peer !== p) {
      if(peer === p) peer = null;
      try { p.destroy(); } catch(e) {}
      return;
    }
    then();
  });
}

window.quickMatch = function() {
  if(!requireLocalAccount()) return;
  stopDemo();
  if(peer) peer.destroy();
  peer = null;
  quickMatchRooms = null;
  quickMatchHosted = false;
  quickMatchAutoStart = null;
  qmClientCountdown = null;
  qmSeq++;
  qmRendezvousStarted = false;

  isMultiplayer = true;
  isLobbyLeader = false;
  leaderId = null;
  currentLobbyCode = null;
  peerConnections.clear();
  roster = [];
  lastSeenByPeer.clear();
  lastSeqByPeer.clear();

  myNetId = "brawlbound-client-" + Math.random().toString(36).substring(2, 8);
  peer = new Peer(myNetId);
  menu("\u26A1 Quick Match: searching for open lobbies...");

  qmGen++;          // new search — invalidate all callbacks from previous searches
  qmRescued = false;
  armQmWatchdog(20000); // safety net: never leave the player searching forever

  const searchPeer = peer;   // callbacks only act while this peer is still current
  const searchGen = qmGen;   // captured BEFORE registering: recovery/restart must never
                             // let this peer's late callbacks adopt a newer generation
  peer.on("connection", conn => setupConnectionEvents(conn));
  peer.on("error", err => { if(peer === searchPeer && searchGen === qmGen) handleQuickMatchPeerError(err); });

  peer.on("open", () => {
    if(searchGen !== qmGen || peer !== searchPeer) return; // stale — invalidated while opening
    const gen = searchGen;
    // 1) Try listing rooms through the broker (works when the broker allows it)
    try {
      peer.listAllPeers(async allPeers => {
        if(gen !== qmGen) return; // search was invalidated (restart / recovery)
        const rooms = (allPeers || []).filter(id => typeof id === "string" && id.startsWith("brawlbound-room-"));
        if(rooms.length > 0) {
          // Ask every room how full it is, then join the one with the most open seats.
          // A lobby that's mid-match still counts — the newcomer spectates until it ends.
          qmQuerying = true;
          const statuses = await Promise.all(rooms.map(async roomId => {
            const info = await queryRoomStatus(roomId);
            return info ? { roomId, players: info.players, capacity: info.capacity || 6 } : null;
          }));
          qmQuerying = false;
          if(gen !== qmGen) return; // search was invalidated while probing
          const openRooms = statuses
            .filter(s => s && s.players < s.capacity)
            .sort((a, b) => b.players - a.players);
          if(openRooms.length > 0) {
            quickMatchRooms = openRooms.map(s => s.roomId);
            tryNextQuickMatchRoom();
          } else {
            // Every listed room is full — use quick-match rendezvous codes
            startQuickMatchRendezvous();
          }
        } else {
          // No rooms listed (or listing unsupported) — use quick-match rendezvous codes
          startQuickMatchRendezvous();
        }
      });
    } catch(e) {
      startQuickMatchRendezvous();
    }
  });
};

function startQuickMatchRendezvous() {
  if(qmRendezvousStarted) return;
  qmRendezvousStarted = true;
  // Probe the rendezvous codes first: if a host is already waiting on one, join the
  // fullest non-full room. Only when no open room answers do we claim a code and host.
  const gen = qmGen; // captured BEFORE waiting — a recovery/restart must not be adopted
  ensureLivePeer(() => {
    if(gen !== qmGen) return; // invalidated while waiting for a live peer
    qmQuerying = true;
    Promise.all(QM_CODES.map(async code => {
      const info = await queryRoomStatus("brawlbound-room-" + code);
      return info ? { code, players: info.players, capacity: info.capacity || 6 } : null;
    })).then(statuses => {
      if(gen !== qmGen) return; // search was invalidated while probing
      qmQuerying = false;
      const open = statuses
        .filter(s => s && s.players < s.capacity)
        .sort((a, b) => b.players - a.players);
      if(open.length > 0) {
        quickMatchRooms = open.map(s => "brawlbound-room-" + s.code);
        tryNextQuickMatchRoom();
      } else {
        // No reachable open rendezvous room — claim a code and become the host
        quickMatchRendezvous(QM_CODES.slice());
      }
    }).catch(() => {
      qmQuerying = false;
      quickMatchRendezvous(QM_CODES.slice());
    });
  });
}

// 2) Rendezvous: try to CLAIM a quick-match room code. A taken code means a host is
//    already waiting there — join them. If we claim it, we become the host.
function quickMatchRendezvous(codes) {
  if(codes.length === 0) {
    // Every QM code is taken or unreachable AND every join failed — the world is
    // full or the matchmaking service is down. Stop with a retryable error instead
    // of an undiscoverable random-code lobby (Quick Match clients only probe QM codes).
    console.warn("Quick Match: no open room found and no QM code claimable");
    leaveLobby("\u26A1 Quick Match couldn't find an open lobby (or create one) right now. \nPlease try again in a minute!");
    return;
  }
  const gen = qmGen; // this claim belongs to the current search generation
  const code = codes.shift();
  const roomId = "brawlbound-room-" + code;
  const claim = new Peer(roomId);
  let settled = false;
  let claimTimer = null;
  const settle = fn => { if(settled) return; settled = true; if(claimTimer) clearTimeout(claimTimer); fn(); };

  // A claim that neither opens nor errors (flaky network / unresponsive broker) must
  // not hang the search forever — give up on this code after 6s and try the next one.
  // The claim peer is always destroyed, even on a stale generation, so a late "open"
  // can never retain the room code without becoming a functioning host
  claimTimer = setTimeout(() => settle(() => {
    try { claim.destroy(); } catch(e) {}
    if(gen !== qmGen) return; // search was invalidated — do not recurse into a new claim
    quickMatchRendezvous(codes);
  }), 6000);

  claim.on("open", () => settle(() => {
    if(gen !== qmGen) { try { claim.destroy(); } catch(e) {} return; } // stale claim — never take over
    // We own this room code — become the quick-match host
    if(peer) peer.destroy();
    peer = claim;
    myNetId = roomId;
    leaderId = myNetId;
    isLobbyLeader = true;
    isMultiplayer = true;
    roster = [{ id: myNetId, hero: p1HeroChoice, username: activeUsername(), tagCosmetics: getNameplateCosmeticIds(), skins: getSkinSelection() }];
    currentLobbyCode = code;
    quickMatchRooms = null;
    quickMatchHosted = true;
    quickMatchAutoStart = null;
    qmClientCountdown = null;
    peerConnections.clear();
    lastSeenByPeer.clear();
    lastSeqByPeer.clear();
    wireHostPeer();
    disarmQmWatchdog(); // landed as host — disarm the search watchdog
    refreshLobbyMenu();
  }));

  claim.on("error", err => settle(() => {
    try { claim.destroy(); } catch(e) {}
    if(gen !== qmGen) return; // search was invalidated — do not cascade
    if(err && err.type === "unavailable-id") {
      // A host already holds this code — join their lobby (remaining codes are fallbacks)
      joinQuickRoom(roomId, codes);
    } else {
      // Broker hiccup on this code — try the next one
      quickMatchRendezvous(codes);
    }
  }));
}

function joinQuickRoom(roomId, remainingCodes) {
  const gen = qmGen; // this join attempt belongs to the current search generation
  leaderId = roomId;
  currentLobbyCode = roomId.replace("brawlbound-room-", "");
  quickMatchRooms = remainingCodes.map(c => "brawlbound-room-" + c);
  ensureLivePeer(() => {
    if(gen !== qmGen || !quickMatchRooms) return; // search was invalidated while waiting for a peer
    const conn = peer.connect(roomId, { reliable: true });
    if(!conn) { tryNextQuickMatchRoom(); return; } // fail safe: dead peer
    qmActiveConn = conn; // this connection now drives the search
    setupConnectionEvents(conn);
    menu(`\u26A1 Quick Match: joining lobby [ ${currentLobbyCode} ]...`);

    const attempt = ++qmSeq;
    // Armed until actual admission: a successful join clears quickMatchRooms
    // (ROSTER_SYNC / SPECTATE_MODE), which neutralizes this safety timer
    let roomTimeout = setTimeout(() => {
      if(gen !== qmGen || attempt !== qmSeq || !quickMatchRooms) return;
      qmSeq++;
      try { conn.close(); } catch(e) {}
      tryNextQuickMatchRoom();
    }, 5000);
    conn.on("open", () => {
      if(gen !== qmGen || attempt !== qmSeq) return;
      // Connected — now we wait for admission (ROSTER_SYNC / SPECTATE_MODE)
      clearTimeout(roomTimeout);
      roomTimeout = setTimeout(() => {
        if(gen !== qmGen || attempt !== qmSeq || !quickMatchRooms) return;
        qmSeq++;
        try { conn.close(); } catch(e) {}
        tryNextQuickMatchRoom();
      }, 5000);
    });
    // Joined! ROSTER_SYNC will clear quickMatchRooms and show the lobby
  });
}

function tryNextQuickMatchRoom() {
  if(!quickMatchRooms) return;
  if(quickMatchRooms.length === 0) {
    // Tried every open room without success — claim a discoverable QM code and host
    // there (bounded by the claim timeouts and the search watchdog). If the claim
    // flow is exhausted too, it ends with a retryable error, never a random-code room.
    quickMatchRendezvous(QM_CODES.slice());
    return;
  }
  const roomId = quickMatchRooms.shift();
  const gen = qmGen; // this join attempt belongs to the current search generation
  ensureLivePeer(() => {
    if(gen !== qmGen || !quickMatchRooms) return; // joined/ended while waiting for a live peer
    leaderId = roomId;
    currentLobbyCode = roomId.replace("brawlbound-room-", "");
    menu(`\u26A1 Quick Match: joining lobby [ ${currentLobbyCode} ]...`);

    const conn = peer.connect(roomId, { reliable: true });
    if(!conn) { tryNextQuickMatchRoom(); return; } // fail safe: dead peer
    qmActiveConn = conn; // this connection now drives the search
    setupConnectionEvents(conn);

    const attempt = ++qmSeq;
    // Same admission-based safety timer as joinQuickRoom: armed until the room
    // lets us in (ROSTER_SYNC / SPECTATE_MODE) or this attempt is invalidated
    let roomTimeout = setTimeout(() => {
      if(gen !== qmGen || attempt !== qmSeq || !quickMatchRooms) return;
      qmSeq++; // invalidate this attempt
      try { conn.close(); } catch(e) {}
      tryNextQuickMatchRoom();
    }, 5000);
    conn.on("open", () => {
      if(gen !== qmGen || attempt !== qmSeq) return;
      clearTimeout(roomTimeout);
      roomTimeout = setTimeout(() => {
        if(gen !== qmGen || attempt !== qmSeq || !quickMatchRooms) return;
        qmSeq++;
        try { conn.close(); } catch(e) {}
        tryNextQuickMatchRoom();
      }, 5000);
    });
  });
}

// Quick Match lobbies auto-start 15s after a second player joins (host side)
let qmLastShown = -1;
setInterval(() => {
  if(quickMatchHosted && isMultiplayer && isLobbyLeader && state === "menu" && roster.length >= 2) {
    if(!quickMatchAutoStart) quickMatchAutoStart = Date.now() + 15000;
    const remaining = Math.max(0, Math.ceil((quickMatchAutoStart - Date.now()) / 1000));
    if(remaining <= 0) {
      quickMatchAutoStart = null;
      qmClientCountdown = null;
      startLobbyMatch();
      return;
    }
    if(remaining !== qmLastShown) {
      qmLastShown = remaining;
      qmClientCountdown = remaining;
      refreshLobbyMenu();
    }
    outgoingSeq++;
    broadcastToPeers({ type: "QM_COUNTDOWN", remaining, seq: outgoingSeq });
  } else if(quickMatchAutoStart) {
    quickMatchAutoStart = null;
    qmLastShown = -1;
    qmClientCountdown = null;
  }
}, 1000);

function refreshLobbyMenu() {
  const qmLine = qmClientCountdown !== null
    ? ` <span style="color:#ffd000;">⏳ Match starts in ${qmClientCountdown}s</span>`
    : "";
  menu(`Lobby [ <span style="color:#ff5533; font-weight:900;">${currentLobbyCode || "..."}</span> ] - (${roster.length}/6 Players) ${isLobbyLeader ? '👑 (Host)' : ''}${qmLine}`);
}

// --- DENTLEY: Hollow Armor, Squire & Husk ---
function beginDentleyLunge(e, distance, duration, damage, knockback, finisher = false, stun = 0) {
  e.lungeT = duration;
  e.lungeA = e.a;
  e.lungeVx = Math.cos(e.a) * distance / duration;
  e.lungeVz = Math.sin(e.a) * distance / duration;
  e.lungeDamage = damage;
  e.lungeKb = knockback;
  e.lungeStun = stun;
  e.lungeFinisher = finisher;
  e.lungeHit = new Set();
  e.swing = Math.max(e.swing, duration);
  spawn3DRing(e.x, e.z, 30, 0xcfd8ea);
}

function dentleyAttack(e) {
  if(e.form === 1) { e.c1 = 0.3; melee(e, 50, 8, 40, true); return; } // Squire dagger
  if(!(e.comboT > 0)) e.combo = 0;
  const n = e.combo;
  e.combo = (n + 1) % 3; e.comboT = 0.9;
  e.c1 = n === 2 ? 0.8 : 0.5;
  if(n === 2) {
    beginDentleyLunge(e, 40, 0.18, 24, 220, true);
    return;
  }
  melee(e, 70, 14, 90, true);
}

function dentleyGuard(e, c) {
  if(e.form === 0) { // Shield Guard
    e.c2 = c.a1cd; e.guard = 2.0;
    spawn3DRing(e.x, e.z, 26, 0x9fc5ff);
    return;
  }
  e.c2 = 7; e.feintDir = -e.feintDir; // Squire: Dagger Feint sidestep
  const sa = e.a + Math.PI / 2 * e.feintDir;
  for(let i = 0; i < 7; i++) {
    const nx = e.x + Math.cos(sa) * 10, nz = e.z + Math.sin(sa) * 10;
    if(blocked(nx, nz, e.r)) break;
    e.x = nx; e.z = nz;
  }
  e.c1 = Math.max(e.c1, 0.2);
  spawn3DRing(e.x, e.z, 22, 0xcfd8ea);
}

function dentleyLunge(e) {
  if(e.form === 1) { e.c3 = 0; return; } // the Squire has no armor to lunge with
  const charge = e.riposte;
  const dmg = 20 + charge;
  const stun = charge > 0 ? Math.min(0.8, charge / 40 * 0.8) : 0;
  e.riposte = 0; // charge is spent even if the lunge misses
  beginDentleyLunge(e, 90, 0.24, dmg, 220, false, stun);
}

function makeHuskMesh() {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0x7c8696, metalness: 0.8, roughness: 0.4 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(10, 12, 26, 12), m);
  body.position.y = 13; body.castShadow = true;
  const helm = new THREE.Mesh(new THREE.SphereGeometry(8.5, 12, 10), m);
  helm.position.y = 32;
  const slit = new THREE.Mesh(new THREE.BoxGeometry(8, 1.4, 1), new THREE.MeshBasicMaterial({ color: 0x0a0a10 }));
  slit.position.set(0, 32, 8);
  g.add(body, helm, slit);
  return g;
}

// Armor hits 0 HP: it bursts off and Dentley lives on as the Squire (host / solo only)
function breakArmor(t, a) {
  t.armorBreakUsed = true;
  t.form = 1; t.hp = 55; t.mhp = 55;
  t.guard = 0; t.grace = 0.8; t.c1 = 0.5; t.c2 = 0; t.chan = 0; t.combo = 0;
  t.kx = Math.cos(a) * 320; t.kz = Math.sin(a) * 320; // knocked ~40 units from the breaking hit
  const h = { id: "hk_" + Math.random().toString(36).slice(2, 8), x: t.x, z: t.z, hp: 100, life: 8, owner: t, mesh: makeHuskMesh() };
  h.mesh.position.set(t.x, 0, t.z);
  scene.add(h.mesh);
  Husks.push(h); t.husk = h;
  spawn3DRing(t.x, t.z, 70, 0xcfd8ea);
  spawnSparks(t.x, t.z, 0xcfd8ea, 14);
  spawnDamageNumber(t.x, t.z, "ARMOR BROKEN", "#cfd8ea");
  shakeIfNearby(t.x, t.z, 8, 200);
  Snd.play("crate");
  for(const o of E) {
    if(o !== t && !o.dead && areEnemies(t, o) && Math.hypot(o.x - t.x, o.z - t.z) < 70 + o.r) {
      hurt(o, 25, Math.atan2(o.z - t.z, o.x - t.x), 140, t);
    }
  }
}

function rearm(e) {
  const h = e.husk;
  e.form = 0; e.mhp = HEROES[6].hp; e.hp = 70; e.chan = 0; e.c2 = 0; e.husk = null;
  if(h) { disposeHierarchy(h.mesh); const i = Husks.indexOf(h); if(i >= 0) Husks.splice(i, 1); }
  spawn3DRing(e.x, e.z, 40, 0x9fc5ff);
  spawnDamageNumber(e.x, e.z, "RE-ARMORED", "#9fc5ff");
  Snd.play("pickup");
}

function updateHusks(dt) {
  const auth = !isMultiplayer || isLobbyLeader;
  if(!auth) return; // clients receive husks through snapshots
  for(let i = Husks.length - 1; i >= 0; i--) {
    const h = Husks[i];
    h.life -= dt;
    if(h.life <= 0 || h.hp <= 0) {
      if(h.owner && h.owner.husk === h) h.owner.husk = null;
      spawnSparks(h.x, h.z, 0xaab2c0, 8);
      disposeHierarchy(h.mesh);
      Husks.splice(i, 1);
    }
  }
  for(const e of E) { // re-armour channel: stand still within 40 units for 1.4s
    if(e.ci !== 6 || e.form !== 1 || e.dead || !e.husk) { e.chan = 0; continue; }
    if(Math.hypot(e.x - e.husk.x, e.z - e.husk.z) <= 40 && e.moveSpd < 14 && e.stun <= 0) {
      e.chan += dt;
      if(e.chan >= 1.4) rearm(e);
    } else e.chan = 0;
  }
}

function syncRemoteHusks(list) {
  const seen = new Set();
  for(const s of list) {
    seen.add(s.id);
    let h = Husks.find(x => x.id === s.id);
    if(!h) {
      h = { id: s.id, x: s.x, z: s.z, hp: s.hp, life: s.l, owner: null, mesh: makeHuskMesh() };
      h.mesh.position.set(s.x, 0, s.z);
      scene.add(h.mesh);
      Husks.push(h);
    }
    h.hp = s.hp; h.life = s.l;
  }
  for(let i = Husks.length - 1; i >= 0; i--) {
    if(!seen.has(Husks[i].id)) { disposeHierarchy(Husks[i].mesh); Husks.splice(i, 1); }
  }
}

// Height of the obstacle covering arena center (0 if none) — the showcase podium sits on top of it
function centerObstacleHeight() {
  for(const r of currentRects) {
    if(W/2 >= r[0] && W/2 <= r[0] + r[2] && H/2 >= r[1] && H/2 <= r[1] + r[3]) return 65;
  }
  return 0;
}

// Rotating 3D showcase of the selected champion, on a glowing podium at arena center
function rebuildShowcase() {
  if(showcaseMesh) { disposeHierarchy(showcaseMesh); showcaseMesh = null; }
  if(!demoActive) return;
  const podium = new THREE.Group();
  const ped = new THREE.Mesh(
    new THREE.CylinderGeometry(24, 28, 5, 26),
    new THREE.MeshStandardMaterial({ color: 0x1c1a26, metalness: 0.6, roughness: 0.35 })
  );
  ped.position.y = 2.5;
  podium.add(ped);
  const glowRingGeo = new THREE.RingGeometry(26, 29, 30);
  glowRingGeo.rotateX(-Math.PI / 2);
  const glowRing = new THREE.Mesh(glowRingGeo, new THREE.MeshBasicMaterial({
    color: p1HeroChoice === RANDOM_HERO ? "#ffd166" : HEROES[p1HeroChoice].roleCol, transparent: true, opacity: 0.75, side: THREE.DoubleSide
  }));
  glowRing.position.y = 5.4;
  podium.add(glowRing);
  if(p1HeroChoice === RANDOM_HERO) {
    const q = makeMysterySprite();
    q.position.y = 38;
    podium.add(q);
  } else {
    const model = createDetailedHeroModel(p1HeroChoice, false, true, null, null, getSkinSelection());
    model.scale.set(1.55, 1.55, 1.55);
    podium.add(model);
  }
  const baseY = centerObstacleHeight();
  podium.position.set(W/2, baseY, H/2);
  podium.userData.baseY = baseY;
  scene.add(podium);
  showcaseMesh = podium;
}

  }

  isLobbyLeader = false;
  leaderId = null;

  lastSeqByPeer.clear();

  document.getElementById("room-badge").innerText = "ARENA ZONE";

  clearSceneEntities();
  teamMode = false;
  const chosenMap = MAPS[selectedMapIndex];
  currentRects = chosenMap.rects;
  build3DMap(chosenMap);

  const spawns = shuffle(SPAWNS);

  const myHero = resolveHero(p1HeroChoice);
  E = [mk(myHero, spawns[0][0], spawns[0][1], 1, myNetId)];
  pl = E[0];

window.startLobbyMatch = function() {
  if(roster.length < 2) {
    alert("Need at least 2 players in the lobby to start a match!");
    return;
  }
  const spawns = shuffle(SPAWNS);
  const spawnMap = {};
  roster.forEach((r, idx) => {
    spawnMap[r.id] = spawns[idx % spawns.length];
  });
  const heroMap = {}; // the host rolls Random picks so every player sees the same champions
  roster.forEach(r => { heroMap[r.id] = resolveHero(r.hero); });
  const identityMap = {};
  roster.forEach(r => {
    identityMap[r.id] = {
      username: r.id === myNetId ? activeUsername() : safeNetworkUsername(r.username, r.id),
      tagCosmetics: sanitizeCosmeticSelection(r.tagCosmetics),
      skins: sanitizeSkinSelection(r.skins)
    };
  });

  outgoingSeq++;
  broadcastToPeers({
    type: "START_GAME",
    mapIndex: selectedMapIndex,
    spawns: spawnMap,
    heroes: heroMap,
    identities: identityMap,
    seq: outgoingSeq
  });

  launchMeshMatch(spawnMap, heroMap, identityMap);
};

function launchMeshMatch(spawnMap, heroMap = {}, identityMap = {}) {
  clearSceneEntities();
  teamMode = false;
  const chosenMap = MAPS[selectedMapIndex];
  currentRects = chosenMap.rects;
  build3DMap(chosenMap);

  document.getElementById("room-badge").innerText = `ROOM: ${currentLobbyCode}`;

  E = [];
  roster.forEach(r => {
    const sp = spawnMap[r.id] || [W/2, H/2];
    const isMe = (r.id === myNetId);
    const hv = Number.isInteger(heroMap[r.id]) && HEROES[heroMap[r.id]] ? heroMap[r.id] : resolveHero(r.hero);
    const identity = identityMap[r.id] || r;
    const ent = mk(hv, sp[0], sp[1], isMe ? 1 : 2, r.id, null, identity.username, identity.tagCosmetics, identity.skins);
    E.push(ent);
    if(isMe) {
      pl = ent;
      setupViewmodel(hv);
    }
  });

  initMatchView();
}

function updateMatchIntro(dt) {
  introElapsed += dt;
  const fighters = E.filter(e => e && e.mesh);
  const duration = 3.0;
  if(!fighters.length) {
    introElapsed = duration;
  } else {
    const progress = Math.max(0, Math.min(0.9999, introElapsed / duration));
    const slot = progress * fighters.length;
    const index = Math.min(fighters.length - 1, Math.floor(slot));
    const blend = Math.max(0, Math.min(1, slot - index));
    const current = fighters[index];
    const next = fighters[Math.min(fighters.length - 1, index + 1)];
    const targetX = current.x + (next.x - current.x) * blend;
    const targetZ = current.z + (next.z - current.z) * blend;
    const camX = targetX + 82;
    const camZ = targetZ + 115;
    cameraHolder.position.set(camX, 112, camZ);
    const dx = targetX - camX, dz = targetZ - camZ;
    cameraHolder.rotation.set(0, Math.atan2(-dx, -dz), 0);
    camera.rotation.set(Math.atan2(14 - 112, Math.hypot(dx, dz)), 0, 0);
    for(const e of fighters) {
      e.mesh.visible = true;
      e.mesh.position.set(e.x, 0, e.z);
      e.mesh.rotation.y = -e.a + Math.PI / 2;
      if(e.mesh.hpGrp) e.mesh.hpGrp.lookAt(cameraHolder.position);
    }
    const hero = HEROES[current.ci];
    introName.textContent = hero.n;
    introMeta.textContent = (index + 1) + " / " + fighters.length + " · " + hero.role;
  }

  if(introElapsed >= duration) {
    introCard.style.display = "none";
    hud.classList.remove("intro");
    if(pl && pl.mesh) pl.mesh.visible = false;
    cameraHolder.position.set(pl ? pl.x : W/2, 22, pl ? pl.z : H/2);
    cameraHolder.rotation.set(0, yaw, 0);
    camera.rotation.set(pitch, 0, 0);
    countdown = 3.0;
    state = "countdown";
    crosshair.style.display = "block";
    lockPrompt.style.display = isLocked ? "none" : "block";
  }
}

function initMatchView() {
