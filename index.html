// --- MAIN LOOP ---
function upd(dt) {
  if(state === "intro") {
    updateMatchIntro(dt);
    return;
  }
  if(isSpectating && (!spectateTarget || spectateTarget.dead)) findNextSpectateTarget(1);

  // Cursor-steer fallback look (used when Pointer Lock is unavailable)
  if(fallbackLook && !isLocked && !isSpectating && (state === "play" || state === "countdown")) {
    const dead = 70;
    const ex = Math.min(Math.max(0, Math.abs(fbMouse.x) - dead), 420);
    const ey = Math.min(Math.max(0, Math.abs(fbMouse.y) - dead), 300);
    if(ex) yaw -= Math.sign(fbMouse.x) * ex * 0.0028 * dt * 60;
    if(ey) pitch -= Math.sign(fbMouse.y) * ey * 0.0022 * dt * 60;
    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
    cameraHolder.rotation.y = yaw;
    camera.rotation.x = pitch;
  }

  // Your facing always follows the mouse (even while stunned) so spectators see what you see
  if(pl && !pl.dead && !isSpectating) {
    pl.a = -yaw - Math.PI / 2;
    pl.pitch = pitch;
  }

  // While spectating, feed the target's look movement into the weapon sway
  if(isSpectating && spectateTarget) {
    const ty = -spectateTarget.a - Math.PI / 2, tp = spectateTarget.pitch || 0;
    if(specSwayTarget === spectateTarget) {
      let dy = ty - lastSpecYaw;
      dy = Math.atan2(Math.sin(dy), Math.cos(dy));
      mouseVelX += Math.max(-4, Math.min(4, -dy * 18));
      mouseVelY += Math.max(-4, Math.min(4, -(tp - lastSpecPitch) * 18));
    }
    specSwayTarget = spectateTarget; lastSpecYaw = ty; lastSpecPitch = tp;
  } else specSwayTarget = null;

  curSwayX += (mouseVelX - curSwayX) * 0.15;
  curSwayY += (mouseVelY - curSwayY) * 0.15;
  mouseVelX *= 0.8;
  mouseVelY *= 0.8;

  syncHUD();

  if(isSpectating) {
    const st = spectateTarget;
    if(st) {
      const shake = Math.min(2.4, screenShake * 0.12);
      const phase = matchTime * 86;
      cameraHolder.position.set(st.x + Math.sin(phase) * shake, 22 + Math.cos(phase * 1.13) * shake, st.z + Math.cos(phase) * shake);
      cameraHolder.rotation.y = -st.a - Math.PI / 2;
      camera.rotation.x = st.pitch || 0;
      camera.rotation.z = Math.sin(phase * 0.72) * Math.min(0.04, screenShake * 0.002);
      if(viewmodelCi !== st.ci) setupViewmodel(st.ci);
    } else if(viewmodelCi !== null) {
      setupViewmodel(null);
    }
  } else if(pl && !pl.dead) {
    const shake = Math.min(2.4, screenShake * 0.12);
    const phase = matchTime * 86;
    cameraHolder.position.set(pl.x + Math.sin(phase) * shake, 22 + Math.cos(phase * 1.13) * shake, pl.z + Math.cos(phase) * shake);
    camera.rotation.z = Math.sin(phase * 0.72) * Math.min(0.04, screenShake * 0.002);
  }

  const vmEnt = isSpectating ? spectateTarget : pl;
  if(viewmodelHolder.wep && vmEnt) {
    const isAttacking = vmEnt.swing > 0 || vmEnt.fire > 0;
    const forwardKey = controlScheme === "wasd" ? K.KeyW : K.ArrowUp;
    const backKey = controlScheme === "wasd" ? K.KeyS : K.ArrowDown;
    const leftKey = controlScheme === "wasd" ? K.KeyA : K.ArrowLeft;
    const rightKey = controlScheme === "wasd" ? K.KeyD : K.ArrowRight;

    const isMoving = isSpectating ? vmEnt.moveSpd > 15 : !!(forwardKey || backKey || leftKey || rightKey);
    const bob = isMoving ? Math.sin(matchTime * 9) * 0.1 : Math.sin(matchTime * 2.5) * 0.03;
    const sideBob = isMoving ? Math.cos(matchTime * 4.5) * 0.06 : 0;

    const targetX = 3.2 + sideBob - Math.min(0.5, Math.max(-0.5, curSwayX * 0.07));
    const targetY = -3.2 + bob + Math.min(0.35, Math.max(-0.35, curSwayY * 0.05));
    const targetZ = isAttacking ? -4.7 : -5.5;

    viewmodelHolder.position.x += (targetX - viewmodelHolder.position.x) * 0.18;
    viewmodelHolder.position.y += (targetY - viewmodelHolder.position.y) * 0.18;
    viewmodelHolder.position.z += (targetZ - viewmodelHolder.position.z) * 0.18;

    const targetRotX = isAttacking ? -0.28 : (-curSwayY * 0.018);
    const targetRotY = curSwayX * 0.02;
    const targetRotZ = isAttacking ? -0.15 : 0;

    viewmodelHolder.rotation.x += (targetRotX - viewmodelHolder.rotation.x) * 0.18;
    viewmodelHolder.rotation.y += (targetRotY - viewmodelHolder.rotation.y) * 0.18;
    viewmodelHolder.rotation.z += (targetRotZ - viewmodelHolder.rotation.z) * 0.18;
  }

  if(countdown > 0) {
    const prevCeil = Math.ceil(countdown);
    countdown -= dt;
    if(countdown > 0 && Math.ceil(countdown) < prevCeil) Snd.play("beep");
    centerMsg.style.display = "block";
    centerMsg.innerText = countdown > 0.4 ? Math.ceil(countdown) : "BRAWL!";

    for(const e of E) {
      if(e.mesh) {
        e.mesh.position.set(e.x, 0, e.z);
        e.mesh.hpGrp.lookAt(cameraHolder.position);
      }
    }

    if(countdown <= 0) {
      state = "play";
      Snd.play("go");
      centerMsg.style.display = "none";
    }
    return;
  }

  matchTime += dt;
  updateStormAudio();
  if(!demoActive && matchTime > 4.0 && stormRadius > minStormRadius) {
    stormRadius -= dt * 5.0;
  }
  stormMesh.scale.set(stormRadius, 1, stormRadius);
  Snd.musicUpdate((initialStormRadius - stormRadius) / (initialStormRadius - minStormRadius));

  if(!isMultiplayer || isLobbyLeader) {
    if(state === "play" && !demoActive) updateWorldCrate(dt);
    itemSpawnTimer += dt;
    if(itemSpawnTimer > 12.0 && Pickups.length < 3) {
      itemSpawnTimer = 0;
      spawnPickup();
    }
    // Pickups expire after 20s so the arena doesn't clog up
    for(let i = Pickups.length - 1; i >= 0; i--) {
      Pickups[i].life -= dt;
      if(Pickups[i].life <= 0) {
        disposeHierarchy(Pickups[i].mesh);
        Pickups.splice(i, 1);
      }
    }
  }

  if(damageVignetteT > 0) {
    damageVignetteT = Math.max(0, damageVignetteT - dt * 1.5);
  }
  const localHpRatio = pl && !pl.dead && !isSpectating ? Math.max(0, pl.hp / pl.mhp) : 1;
  const lowHpIntensity = Math.max(0, Math.min(1, (0.34 - localHpRatio) / 0.34));
  const lowHpPulse = lowHpIntensity * (0.42 + Math.sin(matchTime * 7.2) * 0.12);
  damageOverlay.style.opacity = Math.max(damageVignetteT, lowHpPulse);
  Snd.updateHeartbeat(state === "play" ? lowHpIntensity : 0, dt);
  if(announcerTimer > 0) {
    announcerTimer = Math.max(0, announcerTimer - dt);
    if(announcerTimer === 0 && announcer) announcer.classList.remove("show");
  }

  for(let i = DamageNumbers.length - 1; i >= 0; i--) {
    const dn = DamageNumbers[i];
    dn.life -= dt;
    dn.sprite.position.y += dn.vy * dt;
    dn.sprite.material.opacity = Math.max(0, dn.life / dn.maxLife);
    if(dn.life <= 0) {
      disposeHierarchy(dn.sprite);
      DamageNumbers.splice(i, 1);
    }
  }

  for(let i = F.length - 1; i >= 0; i--) {
    const f = F[i];
    f.life -= dt;
    f.mesh.material.opacity = Math.max(0, f.life / f.maxLife);
    if(f.life <= 0) {
      disposeHierarchy(f.mesh);
      F.splice(i, 1);
    }
  }

  // ZONES
  for(let i = Zones.length - 1; i >= 0; i--) {
    const z = Zones[i];
    z.life -= dt;

    for(const e of E) {
      const targetPos = getCombatPosition(e, z.owner);
      if(!e.dead && e !== z.owner && !(teamMode && z.owner && e.team === z.owner.team) && Math.hypot(targetPos.x - z.x, targetPos.z - z.z) < z.r + e.r) {
        if(z.kind === "marinara") {
          e.slow = 0.5;
          hurt(e, 13 * dt, Math.atan2(targetPos.z - z.z, targetPos.x - z.x), 0, z.owner);
        } else if(z.kind === "flame") {
          e.slow = 0.4;
          hurt(e, 19 * dt, Math.atan2(targetPos.z - z.z, targetPos.x - z.x), 25, z.owner);
        } else if(z.kind === "peel") {
          e.stun = 1.5;
          hurt(e, 9, Math.atan2(targetPos.z - z.z, targetPos.x - z.x), 150, z.owner);
          spawn3DRing(z.x, z.z, 34, 0xffe853);
          z.life = 0;
        } else if(z.kind === "spore_pod") {
          spawn3DRing(z.x, z.z, 55, 0x9955ff);
          const geo = new THREE.CylinderGeometry(55, 55, 1.5, 20);
          const mat = new THREE.MeshBasicMaterial({ color: 0x8844ee, transparent: true, opacity: 0.35 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(z.x, 1, z.z);
          scene.add(mesh);

          Zones.push({ kind: "spore_cloud", x: z.x, z: z.z, r: 55, life: 3.0, owner: z.owner, mesh });

          e.sporePoison = 3.0;
          e.sporeAttacker = z.owner;
          spawnDamageNumber(e.x, e.z, "BLIGHTED", "#a855f7");

          if(z.owner) {
            z.owner.c2 = 6.0;
            z.owner.activePod = null;
          }
          z.life = 0;
        } else if(z.kind === "spore_cloud") {
          if(e.sporePoison < 0.5) {
            e.sporePoison = 3.0;
            e.sporeAttacker = z.owner;
            spawnDamageNumber(e.x, e.z, "BLIGHTED", "#a855f7");
          }
        }
      }
    }

    if(z.kind === "spore_pod" && z.life <= 0) {
      if(z.owner && z.owner.activePod === z) {
        z.owner.c2 = 6.0;
        z.owner.activePod = null;
      }
    }

    if(z.life <= 0) {
      disposeHierarchy(z.mesh);
      Zones.splice(i, 1);
    }
  }

  updateHusks(dt);

  // ENTITIES
  for(const e of E) {
    if(e.dead) {
      if(e.mesh) e.mesh.visible = false;
      if(e.chain) endChain(e);
      e.pending = [];
      continue;
    }

    const prevX = e.x, prevZ = e.z;

    // Simulated delayed shots (Quackbot Barrage) — lives inside the loop,
    // so it can never fire after the match is over or the entity is gone.
    if(e.pending && e.pending.length) {
      for(let pi = e.pending.length - 1; pi >= 0; pi--) {
        const ps = e.pending[pi];
        ps.t -= dt;
        if(ps.t <= 0) {
          shot(e, e.a + (Math.random()-0.5)*0.1, ps.opts);
          e.pending.splice(pi, 1);
        }
      }
    }

    if(e !== pl && e.mesh) {
      // Hide the body of the player whose eyes we're looking through
      e.mesh.visible = !(isSpectating && e === spectateTarget);
      if(!e.ai) { // remote players follow network targets; bots drive themselves
        const netFollow = 1 - Math.exp(-dt * 15);
        e.x += (e.targetX - e.x) * netFollow;
        e.z += (e.targetZ - e.z) * netFollow;
        e.a = lerpAngle(e.a, e.targetA, netFollow);
        e.pitch += ((e.targetP || 0) - e.pitch) * netFollow;
      }
    }

    e.slow -= dt; e.fire -= dt; e.c1 -= dt; e.c3 -= dt; e.guard -= dt; e.comboT -= dt; e.grace -= dt;
    e.fl -= dt; e.swing -= dt; e.speedBoost -= dt;
    e.emoteCooldown = Math.max(0, e.emoteCooldown - dt);
    if(e.emoteT > 0) {
      e.emoteT -= dt;
      if(e.emoteSprite) {
        e.emoteSprite.position.set(e.x, 62 + (2.2 - Math.max(0, e.emoteT)) * 8, e.z);
        if(e.emoteT <= 0) {
          disposeHierarchy(e.emoteSprite);
          e.emoteSprite = null;
        }
      }
    }

    if(e.chain) updateChain(e, dt);

    if(e.sporePoison > 0) {
      const tickDamage = (15 / 3.0) * dt;
      e.sporePoison -= dt;
      hurt(e, tickDamage, 0, 0, e.sporeAttacker, "unblockable");
    }

    if(e.ci !== 5 || !e.activePod) {
      e.c2 -= dt;
    }

    const distFromCenter = Math.hypot(e.x - W/2, e.z - H/2);
    if(distFromCenter > stormRadius) {
      hurt(e, 10 * dt, Math.atan2(H/2 - e.z, W/2 - e.x), 0, null);
    }

    let mx = 0, mz = 0, at = 0, ab1 = 0, ab2 = 0;

    if(e.chargeT > 0) {
      e.chargeT -= dt;
      e.x += e.chargeVx * dt;
      e.z += e.chargeVz * dt;
      pushCollisions(e);
      for(const t of E) {
        if(t !== e && !t.dead && Math.hypot(t.x-e.x, t.z-e.z) < e.r + t.r + 6 && areEnemies(e, t)) {
          hurt(t, 14, Math.atan2(t.z-e.z, t.x-e.x), 420, e);
          t.stun = 0.8;
        }
      }
    }

    const lunging = e.lungeT > 0;
    if(lunging) {
      e.a = e.lungeA;
      const step = Math.min(dt, e.lungeT);
      const nx = e.x + e.lungeVx * step;
      const nz = e.z + e.lungeVz * step;
      if(!blocked(nx, nz, e.r)) {
        e.x = nx; e.z = nz;
      } else {
        e.lungeT = 0;
      }
      if(!e.lungeFinisher) {
        for(const t of E) {
          if(t === e || t.dead || e.lungeHit.has(t) || !areEnemies(e, t)) continue;
          const targetPos = getCombatPosition(t, e);
          const dx = targetPos.x - e.x, dz = targetPos.z - e.z;
          if(Math.hypot(dx, dz) < e.r + t.r + 8 &&
             Math.abs(Math.atan2(Math.sin(Math.atan2(dz, dx) - e.a), Math.cos(Math.atan2(dz, dx) - e.a))) < 1.15) {
            e.lungeHit.add(t);
            hurt(t, e.lungeDamage, Math.atan2(dz, dx), e.lungeKb, e);
            if(e.lungeStun > 0 && (!isMultiplayer || isLobbyLeader)) t.stun = Math.max(t.stun || 0, e.lungeStun);
          }
        }
      }
      e.lungeT = Math.max(0, e.lungeT - dt);
      if(e.lungeT <= 0) {
        if(e.lungeFinisher) melee(e, 70, e.lungeDamage, e.lungeKb, true);
        e.lungeVx = 0; e.lungeVz = 0;
        e.lungeFinisher = false;
        spawn3DRing(e.x, e.z, 30, 0xcfd8ea);
      }
    }

    if(e.stun > 0) {
      e.stun -= dt;
    } else if(e.chain) {
      // Oink is committed to his chain: no moving or attacking until it finishes
    } else if(lunging) {
      // Dentley's combo finisher and Riposte Lunge carry him forward until the charge ends
    } else if(e === pl) {
      const forwardKey = controlScheme === "wasd" ? K.KeyW : K.ArrowUp;
      const backKey = controlScheme === "wasd" ? K.KeyS : K.ArrowDown;
      const leftKey = controlScheme === "wasd" ? K.KeyA : K.ArrowLeft;
      const rightKey = controlScheme === "wasd" ? K.KeyD : K.ArrowRight;

      const forward = (forwardKey ? 1 : 0) - (backKey ? 1 : 0);
      const strafe = (rightKey ? 1 : 0) - (leftKey ? 1 : 0);
      const sin = Math.sin(yaw), cos = Math.cos(yaw);
      mx = -sin * forward + cos * strafe;
      mz = -cos * forward - sin * strafe;
      e.a = -yaw - Math.PI / 2;
      at = M.down;
      ab1 = P1_ab1;
      ab2 = P1_ab2;

      const baseSpd = (e.ci === 6 && e.form === 1 ? 210 : HEROES[e.ci].sp) * (e.speedBoost > 0 ? 1.35 : 1.0);
      const slowMod = (e.sporePoison > 0) ? 0.55 : (e.slow > 0 ? 0.6 : 1.0);
      const s = baseSpd * slowMod * (e.fire > 0 ? 0.8 : 1.0) * (e.guard > 0 ? 0.8 : 1.0);
      const l = Math.hypot(mx, mz) || 1;
      e.x += (mx/l) * s * dt;
      e.z += (mz/l) * s * dt;

      if(at && e.c1 <= 0) attack(e);
      if(ab1 && e.c2 <= 0) ability1(e);
      if(ab2 && e.c3 <= 0) ability2(e);
    } else if(e.ai) {
      [mx, mz, at, ab1, ab2] = updateAI(e, dt);
      const baseSpd = (e.ci === 6 && e.form === 1 ? 210 : HEROES[e.ci].sp) * (e.speedBoost > 0 ? 1.35 : 1.0);
      const slowMod = (e.sporePoison > 0) ? 0.55 : (e.slow > 0 ? 0.6 : 1.0);
      const s = baseSpd * slowMod * (e.fire > 0 ? 0.8 : 1.0) * (e.guard > 0 ? 0.8 : 1.0);
      const l = Math.hypot(mx, mz) || 1;
      e.x += (mx/l) * s * dt;
      e.z += (mz/l) * s * dt;

      if(at && e.c1 <= 0) attack(e);
      if(ab1 && e.c2 <= 0) ability1(e);
      if(ab2 && e.c3 <= 0) ability2(e);
    }

    if(e === pl) { P1_ab1 = 0; P1_ab2 = 0; }

    e.x += e.kx * dt;
    e.z += e.kz * dt;
    const fr = 1 - Math.min(1, 8*dt);
    e.kx *= fr; e.kz *= fr;

    for(const o of E) {
      if(o !== e && !o.dead) {
        const dx = e.x - o.x, dz = e.z - o.z, d = Math.hypot(dx, dz), m = e.r + o.r;
        if(d > 0 && d < m) {
          e.x += (dx/d)*(m-d)*0.5;
          e.z += (dz/d)*(m-d)*0.5;
        }
      }
    }
    pushCollisions(e);
    pushWorldCrate(e, prevX, prevZ, dt);

    // Pickups (host-authoritative: only the host or solo play collects; clients see them via snapshots)
    if(!isMultiplayer || isLobbyLeader) {
      for(let i = Pickups.length - 1; i >= 0; i--) {
        const p = Pickups[i];
        if(Math.hypot(e.x - p.x, e.z - p.z) < e.r + p.r) {
          Snd.play("pickup");
          p.apply(e);
          spawn3DRing(p.x, p.z, 26, 0x65ff88);
          disposeHierarchy(p.mesh);
          Pickups.splice(i, 1);
        }
      }
    }

    // Movement speed (drives the weapon bob when this player is being spectated)
    e.moveSpd += (Math.hypot(e.x - prevX, e.z - prevZ) / Math.max(dt, 0.0001) - e.moveSpd) * 0.25;

    if(e.mesh) {
      const bobY = (e === pl) ? 0 : Math.sin(matchTime * 2.1 + (e.bobPhase || 0)) * 1.2;
      e.mesh.position.set(e.x, bobY, e.z);
      e.mesh.rotation.y = -e.a + Math.PI / 2;

      // Team-colored HP bars + rings: green for you/allies, red for enemies
      const hpCol = (e === pl || (teamMode && pl && e.team === pl.team)) ? 0x45d988 : 0xff5544;
      e.mesh.hpBar.material.color.setHex(hpCol);
      if(e.mesh.teamRing) {
        e.mesh.teamRing.material.color.setHex(hpCol);
        e.mesh.teamRing.material.opacity = 0.4 + Math.sin(matchTime * 3 + (e.bobPhase || 0)) * 0.16;
      }

      if(e.mesh.armorParts) { // Dentley: armor / Squire look
        const sq = e.form === 1;
        for(const part of e.mesh.armorParts) part.visible = !sq;
        if(e.mesh.shield) e.mesh.shield.visible = e.guard > 0 && !sq;
        e.mesh.scale.setScalar(sq ? 0.82 : 1);
      }
      const ratio = Math.max(0, e.hp / e.mhp);
      e.mesh.hpBar.scale.x = ratio;
      e.mesh.hpBar.position.x = -13 * (1 - ratio);
      e.mesh.hpGrp.lookAt(cameraHolder.position);
    }
  }

  // Projectiles — all termination paths funnel through one finalize step so
  // onDeath fires exactly once (lifetime, wall, or player hit) and no further
  // collisions are processed after a projectile is marked dead.
  if(isMultiplayer && isLobbyLeader) recordCombatHistory();
  for(let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    let finalize = false;

    if(p.t === "b") {
      p.age += dt;
      if(p.out && p.age > 0.48) { p.out = false; p.hit.clear(); }
      if(!p.out) {
        const a = Math.atan2(p.o.z - p.z, p.o.x - p.x);
        p.vx = Math.cos(a)*390;
        p.vz = Math.sin(a)*390;
        if(Math.hypot(p.o.x - p.x, p.o.z - p.z) < 22) finalize = true;
      }
      // Bruno's hammer deflect destroys boomerangs mid-flight (reflect() zeroes life)
      if(p.life <= 0) finalize = true;
    } else {
      p.age += dt;
      p.life -= dt;
      if(p.life <= 0) finalize = true;
    }

    p.x += p.vx * dt;
    p.z += p.vz * dt;
    p.rot += dt * 11;

    p.mesh.position.set(p.x, 14, p.z);
    p.mesh.rotation.y = p.rot;

    if(!finalize && p.out && (!isMultiplayer || isLobbyLeader)) {
      for(const h of Husks) {
        if(h.owner !== p.o && Math.hypot(h.x - p.x, h.z - p.z) < 19) {
          h.hp -= p.d || 8; spawnSparks(h.x, h.z, 0xaab2c0, 3); finalize = true; break;
        }
      }
    }
    // Wall handling: boomerangs switch to their return phase, ricochet balls bank,
    // everything else dies (with its onDeath firing exactly once at finalize)
    if(!finalize && p.out && blocked(p.x, p.z, 2)) {
      if(p.t === "b") {
        p.out = false;
        p.hit.clear();
        p.age = 1;
      } else {
        finalize = true;
      }
    }

    if(!finalize && p.out && worldCrate && worldCrate.bombT === null && (!isMultiplayer || isLobbyLeader)
       && Math.hypot(worldCrate.x - p.x, worldCrate.z - p.z) < worldCrate.r + 8) {
      damageWorldCrate(p.d || 8, p.o);
      finalize = true;
    }

    if(!finalize) {
      for(const t of E) {
        const targetPos = getCombatPosition(t, p.o, p.age * 1000);
        if(t !== p.o && !t.dead && !p.hit.has(t)
           && areEnemies(p.o, t)
           && Math.hypot(targetPos.x - p.x, targetPos.z - p.z) < t.r + 9) {
          p.hit.add(t);
          hurt(t, p.d, Math.atan2(p.vz, p.vx), p.kb, p.o, "projectile");
          if(p.t !== "b") {
            finalize = true;
            break; // a terminating hit stops further collisions this frame
          }
        }
      }
    }

    if(finalize) {
      if(p.onDeath && !p.finalized) {
        p.finalized = true;
        p.onDeath(p.x, p.z);
      }
      disposeHierarchy(p.mesh);
      P.splice(i, 1);
    }
  }

  if(screenShake > 0) screenShake = Math.max(0, screenShake - dt * 22);

  if(state === "play" && !matchOver) {
    // Only the host (or solo play) decides when the match is over
    if(!isMultiplayer || isLobbyLeader) {
      const alive = E.filter(e => !e.dead);
      if(teamMode) {
        const teamsAlive = [...new Set(alive.map(e => e.team))];
        if(teamsAlive.length <= 1) {
          const wTeam = teamsAlive.length === 1 ? teamsAlive[0] : null;
          endMatch(alive.length >= 1 ? alive[0].netId : null, wTeam);
          return;
        }
      } else if(alive.length <= 1) {
        endMatch(alive.length === 1 ? alive[0].netId : null);
        return;
      }
    }
    // Anyone who has died (host or client) switches to spectating
    if(pl && pl.dead && !isSpectating) startSpectating();
  }

  if(demoActive) {
    const aliveN = E.filter(e => !e.dead).length;
    if(aliveN <= 1) {
      demoResetTimer += dt;
      if(demoResetTimer > 1.6) { startDemo(); return; } // fresh round, fresh bots
    } else demoResetTimer = 0;
  }

}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  resize();

  if(!hostVisibilityPaused) {
    if(state === "intro" || state === "countdown" || state === "play") upd(dt);
    else if(state === "menu" && demoActive) upd(dt);
  }

  if(demoActive) {
    const t = now / 1000;
    const cx = W/2 + Math.cos(t * 0.1) * 235 * ARENA_SCALE, cz = H/2 + Math.sin(t * 0.1) * 235 * ARENA_SCALE;
    const cy = 96 + Math.sin(t * 0.21) * 12;
    cameraHolder.position.set(cx, cy, cz);
    // Orient the camera at the arena center (camera looks down -Z, so yaw points -Z at the target)
    const dx = W/2 - cx, dz = H/2 - cz;
    cameraHolder.rotation.set(0, Math.atan2(-dx, -dz), 0);
    const lookY = (showcaseMesh ? showcaseMesh.userData.baseY : 0) + 14;
    camera.rotation.x = Math.atan2(lookY - cy, Math.hypot(dx, dz)); // tilt toward the champion podium
    if(showcaseMesh) {
      showcaseMesh.rotation.y += dt * 0.7;
      showcaseMesh.position.y = showcaseMesh.userData.baseY + Math.sin(t * 1.5) * 1.6;
    }
  }

  // Ambient life: dust drift, storm pulse + slow spin
  dust.rotation.y += dt * 0.02;
  stormMat.opacity = 0.3 + Math.sin(now / 450) * 0.07;
  stormMesh.rotation.y += dt * 0.03;
  updateSparks(dt);
  if(state !== "play") Snd.storm(0); // storm wind only plays during an active match

  if(localHitStopFrames > 0) localHitStopFrames--;
  else renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
// Initial launch
currentRects = MAPS[0].rects;
build3DMap(MAPS[0]);
menu("Select a champion to battle in the arena!");
if(activeProfile()) claimDailyShinies();
else openAccountModal(true);
document.addEventListener("visibilitychange", () => {
  if(document.hidden) {
    if(isMultiplayer && isLobbyLeader && (state === "play" || state === "countdown" || state === "intro") && !hostVisibilityPaused) {
      hostVisibilityPaused = true;
      setHostPauseBanner(true);
      outgoingSeq++;
      broadcastToPeers({ type: "HOST_PAUSE", id: myNetId, paused: true, seq: outgoingSeq });
    }
    return;
  }
  claimDailyShinies();
  if(isMultiplayer && isLobbyLeader && hostVisibilityPaused) {
    hostVisibilityPaused = false;
    lastT = performance.now();
    setHostPauseBanner(false);
    outgoingSeq++;
    broadcastToPeers({ type: "HOST_PAUSE", id: myNetId, paused: false, seq: outgoingSeq });
  }
});
requestAnimationFrame(loop);
